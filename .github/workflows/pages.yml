name: Demo (GitHub Pages)

# Publishes the browser demo of the manager (simulated boards, nothing stored): scripts/build_demo.py.
on:
  push:
    branches: [rework/proto2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python3 scripts/build_demo.py --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
