; PlatformIO-Projektkonfiguration fuer die Escape-Room-Komponenten (ESP32).
; Board bei Bedarf auf das tatsaechlich verwendete ESP32-Modul anpassen.
[platformio]
default_envs = firmware

; Gemeinsame Board-/Buildkonfiguration aller drei Environments.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Keine externen lib_deps mehr noetig: das JSON-Wire-Format wird seit der
; Aufteilung in Client/Json.hpp+cpp/Protocol.hpp+cpp selbst implementiert
; (abhaengigkeitsfrei, portabel), damit dieselbe Implementierung auch vom
; PC-Simulator (Sim/escape_component_sim.cpp per plain g++) genutzt werden kann.

; Bettet manager/manager.html GZIP-KOMPRIMIERT als Binaerblob ins Flash
; (.rodata) ein (siehe scripts/compress_manager_html.py, automatisch vor
; jedem Build ausgefuehrt) - spart ~70-80% Flash-Platz gegenueber der rohen
; Datei. HardwareEsp32::serveManagerHtml() setzt dafuer "Content-Encoding:
; gzip"; alle gaengigen Browser entpacken das nativ, der ESP32 selbst muss
; nichts entpacken. Quelle zum Bearbeiten bleibt src/manager/manager.html
; (unkomprimiert, lesbar) - NIE die .gz-Datei direkt editieren, sie wird bei
; jedem Build ueberschrieben.
board_build.embed_files = src/manager/manager.html.gz
; Erzeugt/aktualisiert die obige .gz-Datei vor jedem Build automatisch.
extra_scripts = pre:scripts/compress_manager_html.py
; Mehrere Raum-Skeletons werden als NVS-Blob persistiert. Die Standard-NVS-
; Partition (20 KiB) reicht fuer bis zu vier Plaene nicht; diese Tabelle fuegt
; dafuer plan_nvs (64 KiB) hinzu und behaelt zwei OTA-App-Slots mit je 1.5 MiB.
board_build.partitions = partitions.csv

; PlatformIO kompiliert standardmaessig ALLE .cpp unter src_dir (= "src"),
; seit dem Umzug von Client/Sim/Manager nach src/esp, src/sim, src/manager
; also auch src/sim/escape_component_sim.cpp - der PC-Simulator nutzt aber
; POSIX-Sockets (arpa/inet.h, sys/socket.h, ...) und definiert ein eigenes
; main(), was mit dem Arduino-Framework kollidiert (fehlende Header bzw.
; "multiple definition of main"). Der Sim wird separat per g++ gebaut (siehe
; src/sim/escape_component_sim.cpp Kopfkommentar), daher hier explizit aus dem
; ESP32-Firmware-Build ausschliessen.
build_src_filter = +<*> -<sim/>

; Normales Environment zum Bauen bzw. Flashen eines neuen Programms:
;   pio run -e firmware
;   pio run -e firmware -t upload
[env:firmware]

; Aendert NUR escfg/authtoken im NVS und startet das Board neu. Es wird weder
; gebaut noch geflasht. Token hier setzen oder ESCAPE_AUTH_TOKEN nur fuer den
; Aufruf als Umgebungsvariable verwenden:
;   pio run -e update-auth-token
[env:update-auth-token]
extra_scripts = post:scripts/device_storage.py
custom_device_action = update-auth-token
custom_auth_token =
; Leer = Auto-Erkennung; alternativ z.B. /dev/ttyUSB0 oder COM4.
custom_device_port =

; Loescht NUR den kompletten Preferences-Namespace "escfg" (Token, Namen,
; Raeume, Plaene und sonstige persistente Konfiguration), nicht das Programm:
;   pio run -e reset-persistent-storage
[env:reset-persistent-storage]
extra_scripts = post:scripts/device_storage.py
custom_device_action = reset-persistent-storage
; Leer = Auto-Erkennung; alternativ z.B. /dev/ttyUSB0 oder COM4.
custom_device_port =


[env:diagnostics]
build_src_filter = -</*> +<diagnostics/*>
custom_device_action = run-diagnostics
; Leer = Auto-Erkennung; alternativ z.B. /dev/ttyUSB0 oder COM4.
custom_device_port =
