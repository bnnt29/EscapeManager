; PlatformIO-Projektkonfiguration fuer die EscapeManager-Bibliothek (ESP32).
;
; Wichtige Befehle:
;   pio run -e esp-dummy -t upload      Vollstaendiges Demo-Image auf echte Hardware
;   pio test -e native                  Portable Protokoll-Tests auf dem PC (mit Sanitizern)
;   pio test -e esp32-test              Dieselben Tests auf echter ESP32-Hardware
;
; Lokale Zugangsdaten/Build-Flags (WLAN usw.) gehoeren in die NICHT versionierte
; secrets.ini (Vorlage: secrets.ini.example) - nie ins Repository committen.
[platformio]
default_envs = esp-dummy
; "secrets.in[i]" statt "secrets.ini": Glob-Muster, das ohne Fehler ins Leere
; laeuft, wenn die Datei nicht existiert.
extra_configs = secrets.in[i]

; ---- Gemeinsame ESP32-Einstellungen ------------------------------------------
; Pinnt Plattform/Framework fuer reproduzierbare Builds (Arduino-ESP32 2.0.17).
; Das Arduino-ESP32-3.x-Setup (pioarduino) wird ueber [env:esp-dummy-arduino3]
; mitgetestet; die Bibliothek muss mit BEIDEN Frameworks kompilieren.
[esp32_common]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Zwei OTA-Slots + plan_nvs (Skeletons) + coredump; das Partitionsschema gehoert
; dem Hostprogramm - siehe partitions.csv und README (Abschnitt Integration).
board_build.partitions = partitions.csv
; Library code of the firmware: protocol + portable network core + ESP platform layer +
; the embedded UI. The PC simulator (src/sim), diagnostics and the Python code are not part of it.
build_src_filter = +<esp/> +<protocol/> +<net/> +<manager/ui_data.cpp>
build_flags = ${env.build_flags}
; Regenerates the embedded manager UI (src/manager/ui_data.cpp) when manager.html changed.
extra_scripts = pre:scripts/build_ui.py
; (the UI is embedded as a C array by src/manager/ui_data.cpp - no embed_files needed)

; ---- Normales Entwicklungs-/Demo-Image ---------------------------------------
; Vollstaendige Firmware mit zwei SIMULIERTEN Komponenten fuer echte Hardware
; (echtes WLAN, HTTP, UDP-Discovery, mDNS, Sicherheit - nur die Raetsel-Logik ist
; simuliert):
;   pio run -e esp-dummy -t upload && pio device monitor
[env:esp-dummy]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../examples/esp_dummy/>

; Wie esp-dummy, aber mit Arduino-ESP32 3.x (pioarduino, benoetigt Python <= 3.13).
[env:esp-dummy-arduino3]
extends = esp32_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
build_src_filter = ${esp32_common.build_src_filter} +<../examples/esp_dummy/>

; Worst case for memory/timing tests: 4 components, all text fields at their limits (examples/esp_dummy, ESCAPE_DEMO_MAX).
[env:esp-dummy-max]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../examples/esp_dummy/>
build_flags = ${env.build_flags} -DESCAPE_DEMO_MAX=1

; The device clock starts 65 s before the 32-bit millisecond wrap (49.7 days): run scripts/hw_wrap_test.mjs.
[env:esp-dummy-wrap]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../examples/esp_dummy/>
build_flags = ${env.build_flags} -DESCAPE_CLOCK_OFFSET_MS=0xFFFF0000UL

; Demo firmware with the Arduino core's DEFAULT partition table (no plan_nvs): all persistent data
; must fit into the 20 KB default NVS. Used to measure how many plan skeletons fit (see HARDWARE_TODO.md).
[env:esp-dummy-defaultnvs]
extends = esp32_common
board_build.partitions = default.csv
build_src_filter = ${esp32_common.build_src_filter} +<../examples/esp_dummy/>

; Host program that owns Wi-Fi (examples/host_wifi): the library must use the host's connection and
; has NO credentials of its own here (-U removes them again). Host credentials: HOST_WIFI_SSID /
; HOST_WIFI_PASSWORD build flags (secrets.ini.example).
[env:host-wifi-first]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../examples/host_wifi/>
build_flags = ${env.build_flags} -UESCAPE_WIFI_SSID -UESCAPE_WIFI_PASSWORD -DHOST_WIFI_ORDER=1

[env:host-wifi-after]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../examples/host_wifi/>
build_flags = ${env.build_flags} -UESCAPE_WIFI_SSID -UESCAPE_WIFI_PASSWORD -DHOST_WIFI_ORDER=2

; ---- Tests ------------------------------------------------------------------
; Portable Kernlogik (src/protocol) auf dem PC. Kryptografie ueber das
; OpenSSL-Backend (libssl-dev), Sanitizer fangen Speicher-/UB-Fehler.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<protocol/> +<net/> +<sim/OpenSslCryptoBackend.cpp>
build_flags =
  -std=gnu++11
  -g -O1
  -Wall -Wextra -Wno-unused-parameter
  -fsanitize=address,undefined -fno-omit-frame-pointer
  -Isrc
  -DESCAPE_NATIVE=1
  -lcrypto

; Dieselben Tests auf echter ESP32-Hardware (mbedTLS-Backend, echte Toolchain).
; Misst zusaetzlich Stack-/Heap-/Zeitverbrauch gegen das Ressourcenbudget.
[env:esp32-test]
extends = esp32_common
test_framework = unity
test_build_src = yes
test_filter = test_core
build_src_filter = -<*> +<protocol/> +<esp/MbedTlsCryptoBackend.cpp>
extra_scripts =

; ---- Maintenance on a running board (no flashing; see scripts/device_storage.py) ----
; PlatformIO refuses to run an environment without any source file, so these list one tiny
; file; the script sets Default(None) and nothing is compiled or flashed.
[maintenance_common]
extends = esp32_common
extra_scripts = post:scripts/device_storage.py
build_src_filter = -<*> +<protocol/Base64Url.cpp>

; Port: custom_device_port below or the ESCAPE_DEVICE_PORT environment variable.
; Stores an own token in NVS and restarts the board (ESCAPE_AUTH_TOKEN env or custom_auth_token):
;   ESCAPE_AUTH_TOKEN='a-long-random-token-value' pio run -e update-auth-token
[env:update-auth-token]
extends = maintenance_common
custom_device_action = update-auth-token
custom_auth_token =
custom_device_port =

; Stores Wi-Fi credentials in NVS (the library connects with them if the host program does not):
;   ESCAPE_WIFI_SSID='MyNet' ESCAPE_WIFI_PASSWORD='secret' pio run -e set-wifi
[env:set-wifi]
extends = maintenance_common
custom_device_action = set-wifi
custom_wifi_ssid =
custom_wifi_password =
custom_device_port =

; Prints device id, versions, token state, IP and heap:
;   pio run -e device-info
[env:device-info]
extends = maintenance_common
custom_device_action = device-info
custom_device_port =

; Erases ALL stored settings (token, names, rooms, plans, Wi-Fi), not the program.
; Destructive, so the port must be given explicitly:
;   ESCAPE_DEVICE_PORT=/dev/ttyACM0 pio run -e reset-persistent-storage
[env:reset-persistent-storage]
extends = maintenance_common
custom_device_action = reset-persistent-storage
custom_device_port =

; Memory report (heap, flash, partitions) - a standalone diagnostics program.
[env:diagnostics]
extends = esp32_common
extra_scripts =
build_src_filter = -<*> +<diagnostics/>
