  // ---- Custom-Konfiguration pro Komponente (auf der Detailseite, siehe renderDetail()) ---
  function buildCustomConfigInput(def) {
    let input;
    if (def.type === "range") {
      input = document.createElement("input");
      input.type = "number";
      input.min = String(def.min);
      input.max = String(def.max);
      input.value = def.value;
    } else if (def.type === "select") {
      input = document.createElement("select");
      for (const opt of def.options) {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt;
        if (opt === def.value) o.selected = true;
        input.appendChild(o);
      }
    } else {
      input = document.createElement("input");
      input.type = "text";
      if (def.maxLength) input.maxLength = def.maxLength;
      input.value = def.value;
    }
    input.dataset.key = def.key;
    return input;
  }

  async function saveCustomConfig(ip, httpPort, id, room, name, fieldsContainer, btn) {
    const config = {};
    for (const input of fieldsContainer.querySelectorAll("[data-key]")) {
      config[input.dataset.key] = String(input.value);
    }
    btn.disabled = true;
    try {
      const res = await securePost(ip, httpPort, "/config", { id, config });
      if (!res.ok) throw new Error("HTTP " + res.status);
      showToast(`Konfiguration an ${name} gesendet: ${formatConfigValues(config)}`, false, "config", room, name);
    } catch (e) {
      showToast(`Konfiguration fehlgeschlagen: ${e.message}`, true, "config", room, name);
    } finally {
      btn.disabled = false;
    }
  }

  // ---- Ablaufplan (#/plan) -----------------------------------------------------
  // Layout: Ebenen (Layer) nebeneinander, je Ebene mehrere Lanes uebereinander,
  // Komponenten/Dummies als Chips in Lanes (Platzierung per HTML5-Drag&Drop),
  // Linien von einem Schritt-Punkt einer Komponente zu einer Ziel-Lane werden
  // per Pointer-Drag + SVG-Overlay gezeichnet (siehe startConnectionDrag()).
  // Gespeichert wird raum-weit aufgeteilt (siehe Client/client.hpp): ein
  // geraeteweites "Skeleton" (Ebenen/Lanes/Dummies/Variablen-Katalog, an ALLE
  // Geraete des Raums verteilt) + je Komponente ein kleiner "Slice" (eigene
  // Lane-Zuordnung/Verbindungen/Variablenwerte, nur auf deren eigenem Geraet).

  function sanitizeConnection(raw) {
    if (!raw || typeof raw !== "object") return null;
    if (!Number.isInteger(raw.step) || typeof raw.layer !== "string" || typeof raw.lane !== "string") return null;
    return { step: raw.step, layer: clip(raw.layer, 20), lane: clip(raw.lane, 20) };
  }

  function sanitizeLane(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.id !== "string" || !raw.id) return null;
    return { id: clip(raw.id, 20), name: clip(String(raw.name ?? raw.id), 40) };
  }

  function sanitizeLayer(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.id !== "string" || !raw.id) return null;
    const lanes = Array.isArray(raw.lanes) ? raw.lanes.slice(0, 20).map(sanitizeLane).filter(Boolean) : [];
    return { id: clip(raw.id, 20), name: clip(String(raw.name ?? raw.id), 40), lanes };
  }

  function sanitizeDummy(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.uuid !== "string" || !raw.uuid) return null;
    return {
      uuid: clip(raw.uuid, 60),
      name: clip(String(raw.name ?? "Dummy"), 40),
      layer: typeof raw.layer === "string" ? clip(raw.layer, 20) : null,
      lane: typeof raw.lane === "string" ? clip(raw.lane, 20) : null,
      connections: Array.isArray(raw.connections) ? raw.connections.slice(0, 4).map(sanitizeConnection).filter(Boolean) : [],
    };
  }

  function sanitizeVariableDef(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.uuid !== "string" || !raw.uuid ||
        typeof raw.name !== "string" || !raw.name) return null;
    const def = sanitizeCustomConfigDef({ ...raw, key: raw.name, value: "" });
    return def ? { uuid: clip(raw.uuid, 40), name: def.key, ...def } : null;
  }

  function planVariableDefinition(uuid, def) {
    const result = { uuid, name: def.key, type: def.type };
    if (def.type === "range") { result.min = def.min; result.max = def.max; }
    if (def.type === "text") result.maxLength = def.maxLength;
    if (def.type === "select") result.options = [...def.options];
    return result;
  }

  function serializedPlanVariables(node) {
    return Object.values(node.variables)
      .filter((variable) => variable.enabled)
      .map((variable) => ({ uuid: variable.uuid, name: variable.name, value: variable.value }));
  }

  function selectedPlanVariableDefinitions() {
    const definitions = [];
    for (const [uuid, node] of planState.nodes) {
      if (node.kind !== "component") continue;
      for (const def of node.customConfig || []) {
        if (node.variables[def.key]?.enabled) definitions.push(planVariableDefinition(uuid, def));
      }
    }
    return definitions;
  }

  // Validiert ein rohes Skeleton-Objekt (von GET /plan-skeleton.json oder aus
  // einer importierten Datei) - nicht vertrauenswuerdige Eingabe.
  function sanitizeSkeleton(raw) {
    if (!raw || typeof raw !== "object") raw = {};
    return {
      planId: typeof raw.planId === "string" ? clip(raw.planId, 60) : "",
      room: typeof raw.room === "string" ? clip(raw.room, 60) : "",
      layers: Array.isArray(raw.layers) ? raw.layers.slice(0, 20).map(sanitizeLayer).filter(Boolean) : [],
      dummies: Array.isArray(raw.dummies) ? raw.dummies.slice(0, 100).map(sanitizeDummy).filter(Boolean) : [],
      variables: Array.isArray(raw.variables) ? raw.variables.slice(0, 50).map(sanitizeVariableDef).filter(Boolean) : [],
    };
  }

  function selectRoomSkeleton(raw, room) {
    const candidates = raw && Array.isArray(raw.plans) ? raw.plans : [raw];
    for (const candidate of candidates) {
      const skeleton = sanitizeSkeleton(candidate);
      if ((!room && skeleton.room) || (room && skeleton.room === room)) return skeleton;
    }
    return null;
  }

  async function planLoadSkeleton(room, showerror = true) {
    const candidates = new Map();
    for (const [, entry] of devices) {
      if (room && entry.data.room !== room) continue;
      candidates.set(`${entry.data.ip}:${entry.data.httpPort}`, entry.data);
    }

    let lastError = null;
    for (const device of candidates.values()) {
      try {
        const skeleton = selectRoomSkeleton(
          await protocolDeviceGet(device.ip, device.httpPort, "/plan-skeleton.json"), room
        );
        if (skeleton) return skeleton;
      } catch (error) {
        if (showerror) lastError = error;
      }
    }

    try {
      const skeleton = selectRoomSkeleton(await protocolGet("/plan-skeleton.json"), room);
      if (skeleton) return skeleton;
      lastError = new Error(`Quellgerät enthält keinen Plan für Raum "${room}"`);
    } catch (error) {
      lastError = error;
    }
    if(showerror) showToast("Ablaufplan für diesen Raum konnte nicht geladen werden: " + (lastError?.message || "kein Gerät erreichbar"), true, "plan", room);
    return sanitizeSkeleton({ room });
  }

  // Uebernimmt fuer jede aktuell bekannte Komponente (aus devices, per uuid)
  // deren eigenen Ablaufplan-Slice (d.plan, kommt bereits ueber /status.json
  // mit); alles, was frueher im Plan platziert war, aber gerade nicht live
  // ist, bleibt mit den zuletzt bekannten Werten erhalten (available:false).
  function mergeLiveComponents() {
    const liveUuids = new Set();
    for (const [, entry] of devices) {
      const d = entry.data;
      if (!d.uuid || (planState.room && d.room !== planState.room)) continue;
      liveUuids.add(d.uuid);
      const slice = d.plan && (!d.plan.planId || !planState.planId || d.plan.planId === planState.planId)
        ? d.plan
        : null;
      const existing = planState.nodes.get(d.uuid);
      const storedVariables = slice ? slice.variables : (existing ? existing.variables : {});
      const variables = {};
      for (const def of d.customConfig) {
        const stored = storedVariables[def.key];
        const selectedBySkeleton = planState.variableCatalog.some((variable) =>
          variable.uuid === d.uuid && variable.name === def.key
        );
        variables[def.key] = {
          uuid: d.uuid,
          name: def.key,
          value: stored ? stored.value : def.value,
          enabled: stored ? stored.enabled : selectedBySkeleton,
        };
      }
      planState.nodes.set(d.uuid, {
        kind: "component",
        name: d.name,
        lastRoom: d.room,
        ip: d.ip,
        httpPort: d.httpPort,
        id: d.id,
        totalSteps: d.puzzle.totalSteps || 0,
        currentStep: Math.max(0, Math.min(d.puzzle.totalSteps || 0, d.puzzle.step || 0)),
        planActions: [...d.planActions],
        customConfig: d.customConfig.map((def) => ({ ...def })),
        layer: slice ? slice.layer : (existing ? existing.layer : null),
        lane: slice ? slice.lane : (existing ? existing.lane : null),
        connections: slice ? slice.connections : (existing ? existing.connections : []),
        variables,
        available: true,
      });
    }
    for (const [uuid, node] of planState.nodes) {
      if (node.kind === "component" && !liveUuids.has(uuid)) node.available = false;
    }
    normalizeLaneAssignments();
  }

  function normalizeLaneAssignments() {
    const occupied = new Set();
    for (const node of planState.nodes.values()) {
      if (!node.layer || !node.lane) continue;
      const key = `${node.layer}|${node.lane}`;
      if (occupied.has(key)) {
        node.layer = null;
        node.lane = null;
      } else {
        occupied.add(key);
      }
    }
  }

  async function initPlanView(reload, requestedRoom = "", renderplan = true) {
    const knownRooms = [...new Set([...devices.values()].map((entry) => entry.data.room))].sort();
    const targetRoom = requestedRoom || planState.room || (activeRoom !== "__all__" ? activeRoom : knownRooms[0] || "");
    if (reload || !planState.loaded || targetRoom !== planState.room) {
      const loadId = ++planState.loadSeq;
      planState.loading = true;
      const skeleton = await getCachedPlanSkeleton(targetRoom, reload, renderplan);
      if (loadId !== planState.loadSeq) return;
      planState.planId = skeleton.planId || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      planState.room = targetRoom || skeleton.room;
      planState.layers = skeleton.layers;
      planState.variableCatalog = skeleton.variables;
      planState.nodes = new Map();
      for (const dum of skeleton.dummies) {
        planState.nodes.set(dum.uuid, {
          kind: "dummy", name: dum.name, layer: dum.layer, lane: dum.lane,
          connections: dum.connections, variables: {}, customConfig: [], ip: null, id: null, totalSteps: 1, available: true,
        });
      }
      planState.loaded = true;
      planState.layerSeq = Math.max(0, ...planState.layers.map((layer) => Number(layer.id.replace(/^\D+/, "")) || 0));
      planState.laneSeq = Math.max(0, ...planState.layers.flatMap((layer) => layer.lanes.map((lane) => Number(lane.id.replace(/^\D+/, "")) || 0)));
      planState.loading = false;
    }
    mergeLiveComponents();
    if (renderplan) renderPlanView();
  }

  function computePlanProgress() {
    const completed = new Set();
    const started = new Set();
    for (const [uuid, node] of planState.nodes) {
      if (node.kind !== "component"){
        if (node.kind === "dummy" && node.layer && node.lane && planLayerIndex(node.layer) === 0) completed.add(uuid);
        continue;
      }
      if (node.totalSteps > 0 && node.currentStep >= node.totalSteps) completed.add(uuid);
      else if (node.currentStep > 0) started.add(uuid);
    }

    const connectionReached = (sourceUuid, connection) => {
      const source = planState.nodes.get(sourceUuid);
      if (!source) return false;
      if (source.kind === "dummy") return completed.has(sourceUuid);
      return completed.has(sourceUuid) || source.currentStep >= connection.step;
    };
    const incomingConnections = (target) => {
      const incoming = [];
      for (const [sourceUuid, source] of planState.nodes) {
        for (const connection of source.connections) {
          if (connection.layer === target.layer && connection.lane === target.lane) {
            incoming.push({ sourceUuid, connection });
          }
        }
      }
      return incoming;
    };

    let changed = true;
    while (changed) {
      changed = false;
      for (const [uuid, node] of planState.nodes) {
        if (node.kind !== "dummy" || completed.has(uuid) || !node.layer || !node.lane) continue;
        const incoming = incomingConnections(node);
        if (incoming.length && incoming.every(({ sourceUuid, connection }) => connectionReached(sourceUuid, connection))) {
          completed.add(uuid);
          changed = true;
        }
      }
    }

    const activated = new Set();
    for (const [uuid, node] of planState.nodes) {
      if (!node.layer || !node.lane) continue;
      const incoming = incomingConnections(node);
      if (!incoming.length || incoming.every(({ sourceUuid, connection }) => connectionReached(sourceUuid, connection))) {
        activated.add(uuid);
      }
    }

    const assignedComponents = [...planState.nodes.entries()].filter(([, node]) =>
      node.kind === "component" && node.layer && node.lane
    );
    const totalSteps = assignedComponents.reduce((sum, [, node]) => sum + node.totalSteps, 0);
    const completedSteps = assignedComponents.reduce((sum, [, node]) => sum + Math.min(node.currentStep, node.totalSteps), 0);
    return {
      completed,
      started,
      activated,
      componentCount: assignedComponents.length,
      completedComponents: assignedComponents.filter(([uuid]) => completed.has(uuid)).length,
      startedComponents: assignedComponents.filter(([uuid]) => started.has(uuid)).length,
      activatedComponents: assignedComponents.filter(([uuid]) => activated.has(uuid)).length,
      totalSteps,
      completedSteps,
      connectionReached(uuid, connection) {
        return connectionReached(uuid, connection);
      },
    };
  }

  function mkPlanBtn(label, onClick) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "planActionBtn";
    btn.textContent = label;
    btn.addEventListener("click", onClick);
    return btn;
  }

  function cssEscape(s) {
    return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, "_");
  }

  function renderStepDot(uuid, node, step, progress) {
    const dot = document.createElement("div");
    dot.className = "planStepDot";
    if (node.connections.some((c) => c.step === step)) dot.classList.add("connected");
    if (planState.mode === "view") {
      if ((node.kind === "dummy" && progress.completed.has(uuid)) ||
          (node.kind === "component" && step <= node.currentStep)) {
        dot.classList.add("done");
      }
      if (node.kind === "component" && node.currentStep > 0 && node.currentStep < node.totalSteps && step === node.currentStep) {
        dot.classList.add("current");
      }
    }
    dot.textContent = node.kind === "dummy" ? "→" : String(step);
    dot.dataset.uuid = uuid;
    dot.dataset.step = String(step);
    if (planState.mode === "edit") {
      dot.title = "Ziehen, um eine Verbindung zu einer Lane zu erstellen";
      dot.addEventListener("pointerdown", (ev) => startConnectionDrag(ev, uuid, step));
    } else {
      dot.title = node.kind === "dummy" ? "Automatischer Übergang" : `Schritt ${step}`;
    }
    return dot;
  }

  function connectionId(sourceUuid, connection) {
    return [
      "plan-connection",
      sourceUuid,
      connection.step,
      connection.layer,
      connection.lane,
    ].join("-");
  }

    function updatePlanStats(progress) {
    const stats = document.querySelector('[data-role="plan-stats"]');

    // Die Stats existieren nur im View-Modus.
    if (!stats) return;

    const activated = stats.querySelector(
      '[data-role="activated-components"]'
    );

    const started = stats.querySelector(
      '[data-role="started-components"]'
    );

    const completedComponents = stats.querySelector(
      '[data-role="completed-components"]'
    );

    const completedSteps = stats.querySelector(
      '[data-role="completed-steps"]'
    );

    const progressFill = stats.querySelector(
      '[data-role="plan-progress-fill"]'
    );

    if (activated) {
      activated.textContent = String(progress.activatedComponents);
    }

    if (started) {
      started.textContent = String(progress.startedComponents);
    }

    if (completedComponents) {
      completedComponents.textContent = String(progress.completedComponents);

      // Der Text hinter <strong> bleibt bei der Erstellung statisch.
      // Deshalb aktualisieren wir den kompletten Parent-Text sauber.
      completedComponents.parentNode.lastChild.textContent =
        ` von ${progress.componentCount} abgeschlossen`;
    }

    if (completedSteps) {
      completedSteps.textContent = String(progress.completedSteps);

      completedSteps.parentNode.lastChild.textContent =
        ` von ${progress.totalSteps} Schritten`;
    }

    if (progressFill) {
      const percent = progress.totalSteps
        ? Math.round(100 * progress.completedSteps / progress.totalSteps)
        : 0;

      progressFill.style.width =
        `${Math.max(0, Math.min(100, percent))}%`;
    }
  }


  function updatePlanRuntimeOnly() {
    const progress = computePlanProgress();

    for (const [uuid, node] of planState.nodes) {
      const chip = document.getElementById(`plan-node-${uuid}`);
      if (!chip) continue;

      const completed = progress.completed.has(uuid);
      const started = progress.started.has(uuid);
      const activated = progress.activated.has(uuid);

      // ------------------------------------------------------------
      // Gesamten Node-Status aktualisieren
      // ------------------------------------------------------------
      chip.classList.toggle("completed", completed);
      chip.classList.toggle("started", !completed && started);
      chip.classList.toggle("active", !completed && !started && activated);
      chip.classList.toggle("pending", !completed && !started && !activated);

      // ------------------------------------------------------------
      // Einzelne Schritt-Punkte aktualisieren
      // ------------------------------------------------------------
      for (const dot of chip.querySelectorAll(".planStepDot")) {
        const step = Number(dot.dataset.step);

        const done =
          node.kind === "dummy"
            ? completed
            : step <= node.currentStep;

        const current =
          node.kind === "component" &&
          node.currentStep > 0 &&
          node.currentStep < node.totalSteps &&
          step === node.currentStep;

        dot.classList.toggle("done", done);
        dot.classList.toggle("current", current);

        const connected = node.connections.some(
          (connection) => connection.step === step
        );

        dot.classList.toggle("connected", connected);
      }

      // ------------------------------------------------------------
      // Dummy-Badge aktualisieren
      // ------------------------------------------------------------
        if (node.kind === "dummy") {
        const dummyBadge = chip.querySelector(
          '[data-role="dummy-status"]'
        );

        const isCompleted = progress.completed.has(uuid);

        if (dummyBadge) {
          dummyBadge.classList.toggle("ok", isCompleted);
          dummyBadge.textContent = isCompleted
            ? "automatisch abgeschlossen"
            : "wartet auf Vorgänger";
        }

        continue;
      }

      // ------------------------------------------------------------
      // Komponenten-Badge aktualisieren
      // ------------------------------------------------------------
      const statusBadge = chip.querySelector('[data-role="status"]');

      if (statusBadge) {
        statusBadge.className =
          "badge plan-node-status" +
          (completed ? " ok" : started ? " warn" : "");

        statusBadge.textContent =
          completed ? "abgeschlossen" :
          started ? "gestartet" :
          activated ? "aktiv" :
          "wartet";
      }

      // Fortschrittsbadge: beispielsweise "2 / 5".
      const stepsBadge = chip.querySelector('[data-role="steps"]');

      if (stepsBadge) {
        stepsBadge.textContent = `${node.currentStep} / ${node.totalSteps}`;
      }

      // Verfügbarkeitsbadge gegebenenfalls nachführen.
      const availabilityBadge = chip.querySelector(
        '[data-role="availability-status"]'
      );

      if (availabilityBadge) {
        if (!node.available) {
          availabilityBadge.className = "badge offline";
          availabilityBadge.textContent = "nicht verfügbar";
        } else if (planState.room && node.lastRoom !== planState.room) {
          availabilityBadge.className = "badge warn";
          availabilityBadge.textContent = "Raum: " + node.lastRoom;
        }
      }
    }
    for (const layer of planState.layers) {
      const badge = document.querySelector(
        `[data-role="layer-progress"][data-layer-id="${CSS.escape(layer.id)}"]`
      );

      if (!badge) continue;

      const layerNodes = [...planState.nodes.entries()]
        .filter(([, node]) => node.layer === layer.id);

      const doneCount = layerNodes.filter(([uuid]) =>
        progress.completed.has(uuid)
      ).length;

      const allDone =
        layerNodes.length > 0 &&
        doneCount === layerNodes.length;

      badge.classList.toggle("ok", allDone);
      badge.textContent = `${doneCount} / ${layerNodes.length}`;
    }
    updatePlanStats(progress);
    updatePlanConnectionColors(progress);
  }

  function renderPlanNodeChip(uuid, node, progress) {
    const completed = progress.completed.has(uuid);
    const started = progress.started.has(uuid);
    const activated = progress.activated.has(uuid);
    const chip = document.createElement("div");
    chip.id = `plan-node-${uuid}`;
    chip.className = "planNode" + (node.kind === "dummy" ? " dummy" : "") +
      (planState.mode === "view" ? " view " + (completed ? "completed" : started ? "started" : activated ? "active" : "pending") : "");
    chip.draggable = planState.mode === "edit";
    chip.dataset.uuid = uuid;
    if (planState.mode === "edit") {
      chip.addEventListener("dragstart", (ev) => {
        ev.dataTransfer.setData("text/plain", uuid);
        ev.dataTransfer.effectAllowed = "move";
        chip.classList.add("dragging");
      });
      chip.addEventListener("dragend", () => chip.classList.remove("dragging"));
    }

    const nameEl = document.createElement("div"); nameEl.className = "nodeName"; nameEl.textContent = node.name;
    chip.appendChild(nameEl);

    const badges = document.createElement("div");
    badges.className = "nodeBadges";

    if (node.kind === "dummy") {
      const badge = document.createElement("span");

      // Wichtig: eindeutiger Selektor für spätere Runtime-Updates.
      badge.dataset.role = "dummy-status";

      badge.className = "badge" + (completed ? " ok" : "");
      badge.textContent = completed
        ? "automatisch abgeschlossen"
        : "wartet auf Vorgänger";

      badges.appendChild(badge);

    } else if (!node.available) {
      const badge = document.createElement("span");
      badge.className = "badge offline";
      badge.dataset.role = "availability-status";
      badge.textContent = "nicht verfügbar";
      badges.appendChild(badge);

    } else if (planState.room && node.lastRoom !== planState.room) {
      const badge = document.createElement("span");
      badge.className = "badge warn";
      badge.dataset.role = "availability-status";
      badge.textContent = "Raum: " + node.lastRoom;
      badges.appendChild(badge);
    }

    if (planState.mode === "view" && node.kind === "component") {
      const status = document.createElement("span");

      // Wichtig: Das sucht updatePlanRuntimeOnly().
      status.dataset.role = "status";

      status.className =
        "badge plan-node-status" +
        (completed ? " ok" : started ? " warn" : "");

      status.textContent =
        completed ? "abgeschlossen" :
        started ? "gestartet" :
        activated ? "aktiv" :
        "wartet";

      badges.appendChild(status);

      if (node.totalSteps > 0) {
        const steps = document.createElement("span");

        // Ebenfalls für das gezielte Update markieren.
        steps.dataset.role = "steps";
        steps.className = "badge";
        steps.textContent = `${node.currentStep} / ${node.totalSteps}`;

        badges.appendChild(steps);
      }
    }

    if (badges.children.length) {
      chip.appendChild(badges);
    }

    const stepCount = node.kind === "dummy" ? 0 : Math.max(0, node.totalSteps);
    const stepsWrap = document.createElement("div"); stepsWrap.className = "steps";
    if (node.kind === "dummy") {
      stepsWrap.appendChild(renderStepDot(uuid, node, 0, progress));
    } else {
      for (let step = 1; step <= stepCount; step++) stepsWrap.appendChild(renderStepDot(uuid, node, step, progress));
    }
    if (stepsWrap.children.length) chip.appendChild(stepsWrap);
    return chip;
  }

  function renderPlanLane(layer, lane, progress) {
    const laneEl = document.createElement("div");
    laneEl.className = "planLane";
    laneEl.dataset.layerId = layer.id; laneEl.dataset.laneId = lane.id;

    const head = document.createElement("div"); head.className = "laneHead";
    if (planState.mode === "edit") {
      const nameInput = document.createElement("input"); nameInput.value = lane.name;
      nameInput.addEventListener("change", () => { lane.name = nameInput.value.trim() || lane.name; });
      const delBtn = document.createElement("button"); delBtn.type = "button"; delBtn.textContent = "✕"; delBtn.title = "Lane löschen";
      delBtn.addEventListener("click", () => removeLane(layer.id, lane.id));
      head.append(nameInput, delBtn);
    } else {
      const title = document.createElement("div"); title.className = "laneTitle"; title.textContent = lane.name;
      head.appendChild(title);
    }
    laneEl.appendChild(head);

    for (const [uuid, node] of planState.nodes) {
      if (node.layer === layer.id && node.lane === lane.id) laneEl.appendChild(renderPlanNodeChip(uuid, node, progress));
    }

    if (planState.mode === "edit") {
      laneEl.addEventListener("dragover", (ev) => { ev.preventDefault(); laneEl.classList.add("dragover"); });
      laneEl.addEventListener("dragleave", () => laneEl.classList.remove("dragover"));
      laneEl.addEventListener("drop", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        laneEl.classList.remove("dragover");
        placeNodeInLane(ev.dataTransfer.getData("text/plain"), layer.id, lane.id);
      });
    }
    return laneEl;
  }

  function renderPlanLayer(layer, progress) {
    const layerEl = document.createElement("div");
    layerEl.className = "planLayer"; layerEl.dataset.layerId = layer.id;

    const head = document.createElement("div"); head.className = "layerHead";
    if (planState.mode === "edit") {
      const nameInput = document.createElement("input"); nameInput.value = layer.name;
      nameInput.addEventListener("change", () => { layer.name = nameInput.value.trim() || layer.name; });
      const delBtn = document.createElement("button"); delBtn.type = "button"; delBtn.textContent = "✕"; delBtn.title = "Ebene löschen";
      delBtn.addEventListener("click", () => removeLayer(layer.id));
      head.append(nameInput, delBtn);
    } else {
      const title = document.createElement("div"); title.className = "layerTitle"; title.textContent = layer.name;
      const layerNodes = [...planState.nodes.entries()].filter(([, node]) => node.layer === layer.id);
      const state = document.createElement("span");
      state.dataset.role = "layer-progress";
      state.dataset.layerId = layer.id;
      state.className = "badge" + (layerNodes.length && layerNodes.every(([uuid]) => progress.completed.has(uuid)) ? " ok" : "");
      state.textContent = `${layerNodes.filter(([uuid]) => progress.completed.has(uuid)).length} / ${layerNodes.length}`;
      const actions = document.createElement("div"); actions.className = "layerActions";
      const resetBtn = mkPlanBtn("Zurücksetzen", () => runPlanAction("reset", layer.id, `Ebene "${layer.name}" zurücksetzen`));
      resetBtn.disabled = planActionTargets("reset", layer.id).length === 0;
      const completeBtn = mkPlanBtn("Abschließen", () => runPlanAction("complete", layer.id, `Ebene "${layer.name}" abschließen`));
      completeBtn.disabled = planActionTargets("complete", layer.id).length === 0;
      actions.append(resetBtn, completeBtn);
      head.append(title, state, actions);
    }
    layerEl.appendChild(head);

    for (const lane of layer.lanes) layerEl.appendChild(renderPlanLane(layer, lane, progress));

    if (planState.mode === "edit") {
      const dropTarget = document.createElement("div");
      dropTarget.className = "planLayerDrop";
      dropTarget.textContent = "Komponente ablegen: neue Lane";
      dropTarget.addEventListener("dragover", (ev) => {
        ev.preventDefault();
        dropTarget.classList.add("dragover");
      });
      dropTarget.addEventListener("dragleave", () => dropTarget.classList.remove("dragover"));
      dropTarget.addEventListener("drop", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        dropTarget.classList.remove("dragover");
        const uuid = ev.dataTransfer.getData("text/plain");
        if (!planState.nodes.has(uuid)) return;
        const lane = createLane(layer);
        placeNodeInLane(uuid, layer.id, lane.id);
      });
      layerEl.appendChild(dropTarget);

      const addLaneBtn = document.createElement("button");
      addLaneBtn.type = "button"; addLaneBtn.className = "planAddLaneBtn"; addLaneBtn.textContent = "+ Lane";
      addLaneBtn.addEventListener("click", () => addLane(layer.id));
      layerEl.appendChild(addLaneBtn);
    }

    return layerEl;
  }

  function addLayer() {
    planState.layerSeq += 1;
    planState.layers.push({ id: "L" + planState.layerSeq, name: "Ebene " + planState.layerSeq, lanes: [] });
    renderPlanView();
  }

  function removeLayer(layerId) {
    if (!confirm("Ebene inkl. aller Lanes löschen? Zugeordnete Komponenten werden nicht mehr zugeordnet.")) return;
    planState.layers = planState.layers.filter((l) => l.id !== layerId);
    for (const node of planState.nodes.values()) {
      if (node.layer === layerId) { node.layer = null; node.lane = null; }
      node.connections = node.connections.filter((c) => c.layer !== layerId);
    }
    renderPlanView();
  }

  function addLane(layerId) {
    const layer = planState.layers.find((l) => l.id === layerId);
    if (!layer) return;
    createLane(layer);
    renderPlanView();
  }

  function createLane(layer) {
    planState.laneSeq += 1;
    const lane = { id: "A" + planState.laneSeq, name: "Lane " + planState.laneSeq };
    layer.lanes.push(lane);
    return lane;
  }

  function placeNodeInLane(uuid, layerId, laneId) {
    const node = planState.nodes.get(uuid);
    if (!node) return false;
    const occupied = [...planState.nodes.entries()].find(([otherUuid, other]) =>
      otherUuid !== uuid && other.layer === layerId && other.lane === laneId
    );
    if (occupied) {
      showToast(`Lane ist bereits durch "${occupied[1].name}" belegt`, true, "plan", planState.room, node.name);
      return false;
    }
    node.layer = layerId;
    node.lane = laneId;
    renderPlanView();
    return true;
  }

  function removeLane(layerId, laneId) {
    const layer = planState.layers.find((l) => l.id === layerId);
    if (!layer || !confirm("Lane löschen? Zugeordnete Komponenten werden nicht mehr zugeordnet.")) return;
    layer.lanes = layer.lanes.filter((l) => l.id !== laneId);
    for (const node of planState.nodes.values()) {
      if (node.layer === layerId && node.lane === laneId) { node.layer = null; node.lane = null; }
      node.connections = node.connections.filter((c) => !(c.layer === layerId && c.lane === laneId));
    }
    renderPlanView();
  }

  function addDummy() {
    planState.dummySeq += 1;
    const name = prompt("Name des Dummy-Objekts (wird im Ablauf übersprungen):", "Dummy " + planState.dummySeq);
    if (!name) { planState.dummySeq -= 1; return; }
    const uuid = "dummy-" + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + planState.dummySeq));
    planState.nodes.set(uuid, { kind: "dummy", name: clip(name, 40), layer: null, lane: null, connections: [], variables: {} });
    renderPlanView();
  }

  // ---- Verbindungen zeichnen/ziehen (Pointer-Events + SVG-Overlay) -----------
  let connectionDrag = null;

  function startConnectionDrag(ev, uuid, step) {
    ev.preventDefault();
    ev.stopPropagation();
    const svg = $("#planSvg");
    const canvas = $("#planCanvas");
    if (!svg || !canvas) return;
    const canvasRect = canvas.getBoundingClientRect();
    const dotRect = ev.currentTarget.getBoundingClientRect();
    const startX = dotRect.left + dotRect.width / 2 - canvasRect.left + canvas.scrollLeft;
    const startY = dotRect.top + dotRect.height / 2 - canvasRect.top + canvas.scrollTop;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", startX); line.setAttribute("y1", startY);
    line.setAttribute("x2", startX); line.setAttribute("y2", startY);
    line.setAttribute("stroke", "#4f8cff"); line.setAttribute("stroke-width", "2");
    line.setAttribute("stroke-dasharray", "4 3");
    svg.appendChild(line);
    ev.currentTarget.classList.add("dragging-from");
    connectionDrag = { uuid, step, line, sourceDot: ev.currentTarget };

    const onMove = (moveEv) => {
      if (!connectionDrag) return;
      const x = moveEv.clientX - canvasRect.left + canvas.scrollLeft;
      const y = moveEv.clientY - canvasRect.top + canvas.scrollTop;
      connectionDrag.line.setAttribute("x2", x);
      connectionDrag.line.setAttribute("y2", y);
    };
    const onUp = (upEv) => {
      window.removeEventListener("pointermove", onMove);
      finishConnectionDrag(upEv);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp, { once: true });
  }

  function planLayerIndex(layerId) {
    return planState.layers.findIndex((layer) => layer.id === layerId);
  }

  function finishConnectionDrag(upEv) {
    if (!connectionDrag) return;
    const { uuid, step, line, sourceDot } = connectionDrag;
    connectionDrag = null;
    line.remove();
    sourceDot.classList.remove("dragging-from");

    const target = document.elementFromPoint(upEv.clientX, upEv.clientY);
    const laneEl = target ? target.closest(".planLane") : null;
    if (!laneEl) return;
    const node = planState.nodes.get(uuid);
    if (!node) return;
    const sourceLayerIndex = planLayerIndex(node.layer);
    const targetLayerIndex = planLayerIndex(laneEl.dataset.layerId);
    if (sourceLayerIndex < 0 || targetLayerIndex <= sourceLayerIndex) {
      showToast("Verbindungen zu vorherigen oder gleichen Ebenen sind nicht erlaubt", true, "plan", planState.room, node.name);
      return;
    }
    node.connections = node.connections.filter((c) => c.step !== step);
    node.connections.push({ step, layer: laneEl.dataset.layerId, lane: laneEl.dataset.laneId });
    renderPlanView();
  }

  function updatePlanConnectionColors(progress) {
    for (const [uuid, node] of planState.nodes) {
      for (const conn of node.connections) {
        const path = document.getElementById(connectionId(uuid, conn));
        if (!path) continue;

        const reached = progress.connectionReached(uuid, conn);

        path.setAttribute(
          "stroke",
          reached ? "#3ecf6e" : "#596173"
        );

        path.setAttribute(
          "opacity",
          reached ? "1" : ".55"
        );
      }
    }
  }

  function drawPlanConnections() {
    const svg = $("#planSvg");
    const canvas = $("#planCanvas");
    const layersWrap = $("#planLayers");
    if (!svg || !canvas || !layersWrap) return;
    const canvasRect = canvas.getBoundingClientRect();
    svg.setAttribute("width", String(layersWrap.scrollWidth));
    svg.setAttribute("height", String(layersWrap.scrollHeight + 20));
    svg.innerHTML = "";

    const originPoint = (uuid, step) => {
      const dot = canvas.querySelector(`.planStepDot[data-uuid="${cssEscape(uuid)}"][data-step="${step}"]`);
      if (!dot) return null;
      const r = dot.getBoundingClientRect();
      return { x: r.left + r.width / 2 - canvasRect.left + canvas.scrollLeft, y: r.top + r.height / 2 - canvasRect.top + canvas.scrollTop };
    };
    const targetPoint = (layerId, laneId) => {
      const lane = canvas.querySelector(`.planLane[data-layer-id="${cssEscape(layerId)}"][data-lane-id="${cssEscape(laneId)}"]`);
      if (!lane) return null;
      const r = lane.getBoundingClientRect();
      return { x: r.left - canvasRect.left + canvas.scrollLeft, y: r.top + r.height / 2 - canvasRect.top + canvas.scrollTop };
    };

    const progress = computePlanProgress();
    for (const [uuid, node] of planState.nodes) {
      for (const conn of node.connections) {
        const from = originPoint(uuid, conn.step);
        const to = targetPoint(conn.layer, conn.lane);
        if (!from || !to) continue;
        const midX = (from.x + to.x) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.id = connectionId(uuid, conn);
        path.setAttribute("d", `M ${from.x} ${from.y} C ${midX} ${from.y}, ${midX} ${to.y}, ${to.x} ${to.y}`);
        path.setAttribute("fill", "none");
        const reached = progress.connectionReached(uuid, conn);
        path.setAttribute("stroke", planState.mode === "edit" ? "#4f8cff" : reached ? "#3ecf6e" : "#596173");
        path.setAttribute("stroke-width", "2");
        if (planState.mode === "view" && !reached) path.setAttribute("opacity", ".55");
        svg.appendChild(path);

        if (planState.mode !== "edit") continue;
        const del = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        del.setAttribute("cx", String(midX)); del.setAttribute("cy", String((from.y + to.y) / 2)); del.setAttribute("r", "7");
        del.setAttribute("fill", "#f0554e");
        del.style.pointerEvents = "auto";
        del.style.cursor = "pointer";
        del.addEventListener("click", () => {
          node.connections = node.connections.filter((c) => c !== conn);
          renderPlanView();
        });
        svg.appendChild(del);
      }
    }
  }

  window.addEventListener("resize", () => {
    if (currentRoute().view === "plan") drawPlanConnections();
  });

  // ---- Variablen (= Custom-Config-Werte) ---------------------------------------
  function renderVariablePanel() {
    const panel = document.createElement("div"); panel.className = "planVarPanel";
    const title = document.createElement("h3"); title.textContent = "Variablen (Custom-Config-Werte)"; panel.appendChild(title);
    const desc = document.createElement("p");
    desc.style.color = "var(--muted)"; desc.style.fontSize = "12px";
    desc.textContent = "Die Komponenten dieses Raums liefern Typ und aktuellen Wert. Nur markierte Variablen werden im Ablaufplan gespeichert und beim Anwenden geschrieben.";
    panel.appendChild(desc);

    let variableCount = 0;
    for (const [uuid, node] of planState.nodes) {
      if (node.kind !== "component" || !node.available || node.lastRoom !== planState.room) continue;
      const definitions = node.customConfig || [];
      if (!definitions.length) continue;
      const componentLabel = document.createElement("div");
      componentLabel.className = "planVarComponent";
      componentLabel.textContent = node.name;
      panel.appendChild(componentLabel);

      for (const def of definitions) {
        variableCount++;
        const variable = node.variables[def.key] || {
          uuid, name: def.key, value: def.value, enabled: false,
        };
        node.variables[def.key] = variable;

        const row = document.createElement("div"); row.className = "planVarRow";
        const enabled = document.createElement("input");
        enabled.type = "checkbox";
        enabled.checked = !!variable.enabled;
        enabled.title = "Variable in den Ablaufplan aufnehmen";
        enabled.addEventListener("change", () => { variable.enabled = enabled.checked; });

        const label = document.createElement("div");
        const name = document.createElement("div"); name.textContent = def.key;
        const reference = document.createElement("div");
        reference.className = "planVarRef";
        reference.textContent = `${uuid} / ${def.key}`;
        label.append(name, reference);

        const input = buildCustomConfigInput({ ...def, value: variable.value });
        const markEdited = () => {
          variable.value = String(input.value);
          variable.enabled = true;
          enabled.checked = true;
        };
        input.addEventListener("input", markEdited);
        input.addEventListener("change", markEdited);
        row.append(enabled, label, input);
        panel.appendChild(row);
      }
    }

    if (!variableCount) {
      const empty = document.createElement("div"); empty.className = "state-text";
      empty.textContent = "Keine Komponente dieses Raums bietet Custom-Config-Variablen an.";
      panel.appendChild(empty);
    }

    panel.appendChild(mkPlanBtn("Variablen anwenden", applyPlanVariables));
    return panel;
  }

  async function applyPlanVariables() {
    const targets = [];
    for (const [, node] of planState.nodes) {
      if (node.kind !== "component" || !node.available) continue;
      const values = Object.fromEntries(Object.values(node.variables)
        .filter((variable) => variable.enabled)
        .map((variable) => [variable.name, variable.value]));
      if (Object.keys(values).length) targets.push({ node, values });
    }
    if (!targets.length) { showToast("Keine Variablenwerte zum Anwenden gesetzt", true); return; }
    if (!confirm(`Variablen auf ${targets.length} Komponente(n) anwenden?`)) return;
    let okCount = 0, errCount = 0;
    for (const { node, values } of targets) {
      try {
        const res = await securePost(node.ip, node.httpPort, "/config", { id: node.id, config: values });
        if (!res.ok) throw new Error("HTTP " + res.status);
        okCount++;
        logEvent("config", `Variablen an ${node.name} gesendet: ${formatConfigValues(values)}`, false, node.lastRoom, node.name);
      } catch (e) {
        errCount++;
        logEvent("config", `Variablen an ${node.name} fehlgeschlagen: ${e.message}`, true, node.lastRoom, node.name);
      }
    }
    showToast(`Variablen angewendet: ${okCount} ok${errCount ? ", " + errCount + " fehlgeschlagen" : ""}`, errCount > 0);
  }

  function planActionComponents(layerId = "") {
    return [...planState.nodes.values()].filter((node) =>
      node.kind === "component" && node.available && node.lastRoom === planState.room &&
      (!layerId || node.layer === layerId)
    );
  }

  function planActionTargets(action, layerId = "") {
    return planActionComponents(layerId).filter((node) => node.planActions.includes(action));
  }

  async function runPlanAction(action, layerId, label) {
    const components = planActionComponents(layerId);
    const targets = components.filter((node) => node.planActions.includes(action));
    const unsupportedCount = components.length - targets.length;
    if (!components.length) {
      showToast(`${label}: keine verfügbaren Komponenten`, true, "plan", planState.room);
      return;
    }
    if (!targets.length) {
      showToast(`${label}: keine Komponente unterstützt die Planaktion "${action}"`, true, "plan", planState.room);
      return;
    }
    const unsupportedHint = unsupportedCount ? ` ${unsupportedCount} Komponente(n) unterstützen den Befehl nicht.` : "";
    if (!confirm(`${label}? Der Befehl wird an ${targets.length} Komponente(n) gesendet.${unsupportedHint}`)) return;

    let okCount = 0;
    let errCount = unsupportedCount;
    for (const node of targets) {
      try {
        const response = await securePost(node.ip, node.httpPort, "/plan-action", { id: node.id, action });
        if (!response.ok) throw new Error("HTTP " + response.status);
        okCount++;
      } catch (error) {
        errCount++;
        logEvent("plan", `${label} bei ${node.name} fehlgeschlagen: ${error.message}`, true, planState.room, node.name);
      }
    }
    showToast(`${label}: ${okCount} ok${errCount ? ", " + errCount + " nicht ausgeführt" : ""}`, errCount > 0, "plan", planState.room);
    await poll();
  }

  // ---- Speichern auf die Geräte -------------------------------------------------
  async function savePlanToDevices() {
    if (!planState.room) { showToast("Bitte zuerst einen Raum wählen", true); return; }
    if (!confirm(`Ablaufplan auf alle Geräte in Raum "${planState.room}" übertragen?`)) return;

    const skeleton = {
      planId: planState.planId,
      room: planState.room,
      layers: planState.layers,
      variables: selectedPlanVariableDefinitions(),
      dummies: [...planState.nodes.entries()]
        .filter(([, n]) => n.kind === "dummy")
        .map(([uuid, n]) => ({ uuid, name: n.name, layer: n.layer, lane: n.lane, connections: n.connections })),
    };
    const skeletonJson = JSON.stringify(skeleton);

    const roomDevices = new Map();
    for (const [, entry] of devices) {
      if (entry.data.room === planState.room) {
        roomDevices.set(`${entry.data.ip}:${entry.data.httpPort}`, entry.data);
      }
    }

    let okCount = 0, errCount = 0;
    for (const [, device] of roomDevices) {
      try {
        const res = await securePost(device.ip, device.httpPort, "/plan-skeleton", skeletonJson);
        if (!res.ok) throw new Error("HTTP " + res.status);
        okCount++;
      } catch (e) {
        errCount++;
      }
    }
    if (roomDevices.size) {
      logEvent("plan", `Raum-Ablaufplan (Skeleton) an ${okCount} Gerät(e) in "${planState.room}" gesendet${errCount ? ", " + errCount + " fehlgeschlagen" : ""}`, errCount > 0, planState.room);
    }

    for (const [, node] of planState.nodes) {
      if (node.kind !== "component" || !node.available) continue;
      const variables = serializedPlanVariables(node);
      const slicePlan = (node.layer && node.lane) || variables.length
        ? { planId: planState.planId, layer: node.layer, lane: node.lane, connections: node.connections, variables }
        : null;
      try {
        const res = await securePost(node.ip, node.httpPort, "/plan", { id: node.id, plan: slicePlan });
        if (!res.ok) throw new Error("HTTP " + res.status);
        okCount++;
        const message = slicePlan && slicePlan.layer && slicePlan.lane
          ? `Ablaufplan-Zuordnung von ${node.name}: Ebene "${slicePlan.layer}", Lane "${slicePlan.lane}"`
          : slicePlan ? `Ablaufplan-Variablen von ${node.name} gespeichert` : `Ablaufplan-Zuordnung von ${node.name} entfernt`;
        logEvent("plan", message, false, planState.room, node.name);
      } catch (e) {
        errCount++;
        logEvent("plan", `Ablaufplan-Zuordnung von ${node.name} fehlgeschlagen: ${e.message}`, true, planState.room, node.name);
      }
    }

    showToast(`Ablaufplan gespeichert: ${okCount} ok${errCount ? ", " + errCount + " fehlgeschlagen" : ""}`, errCount > 0, "plan", planState.room);
  }

  // ---- JSON-Export/-Import -----------------------------------------------------
  function exportPlanJson() {
    const nodesOut = {};
    for (const [uuid, node] of planState.nodes) {
      nodesOut[uuid] = {
        kind: node.kind,
        name: node.name,
        lastRoom: node.kind === "dummy" ? planState.room : node.lastRoom,
        layer: node.layer, lane: node.lane,
        connections: node.connections,
        variables: node.kind === "component" ? serializedPlanVariables(node) : [],
      };
    }
    const out = {
      planId: planState.planId, room: planState.room,
      layers: planState.layers, variables: planState.variableCatalog, nodes: nodesOut,
    };
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ablaufplan-${(planState.room || "plan").replace(/[^\w-]/g, "_")}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function importPlanJson(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        applyImportedPlan(JSON.parse(String(reader.result)));
      } catch (e) {
        showToast("Ablaufplan konnte nicht gelesen werden: " + e.message, true);
      }
    };
    reader.readAsText(file);
  }

  function applyImportedPlan(raw) {
    if (!raw || typeof raw !== "object") { showToast("Ungültige Ablaufplan-Datei", true); return; }
    const skeleton = sanitizeSkeleton(raw);
    planState.planId = skeleton.planId || planState.planId;
    planState.room = skeleton.room || planState.room;
    planState.layers = skeleton.layers;
    planState.variableCatalog = skeleton.variables;
    planState.nodes = new Map();
    if (raw.nodes && typeof raw.nodes === "object") {
      for (const [uuid, rawNode] of Object.entries(raw.nodes)) {
        if (!rawNode || typeof rawNode !== "object") continue;
        planState.nodes.set(clip(uuid, 60), {
          kind: rawNode.kind === "dummy" ? "dummy" : "component",
          name: clip(String(rawNode.name ?? "?"), 40),
          lastRoom: clip(String(rawNode.lastRoom ?? ""), 60),
          layer: typeof rawNode.layer === "string" ? clip(rawNode.layer, 20) : null,
          lane: typeof rawNode.lane === "string" ? clip(rawNode.lane, 20) : null,
          connections: Array.isArray(rawNode.connections) ? rawNode.connections.slice(0, 32).map(sanitizeConnection).filter(Boolean) : [],
          variables: sanitizePlanVariables(rawNode.variables, clip(uuid, 60)),
          customConfig: skeleton.variables
            .filter((variable) => variable.uuid === clip(uuid, 60))
            .map((variable) => ({ ...variable, key: variable.name, value: "" })),
          available: false, ip: null, id: null, totalSteps: 0, currentStep: 0, planActions: [],
        });
      }
    }
    planState.loaded = true;
    mergeLiveComponents();
    renderPlanView();
    showToast(`Ablaufplan aus Datei geladen (Raum "${planState.room || "?"}")`, false, "plan", planState.room);
    roomProgressCache.delete(planState.room);
  }

  function invalidateRoomPlanCache(room = planState.room) {
    if (room) roomProgressCache.delete(room);
  }

  function renderPlanStats(progress) {
    const stats = document.createElement("div");
    stats.className = "planStats";
    stats.dataset.role = "plan-stats";

    function addStat(role, value, label) {
      const item = document.createElement("span");

      const strong = document.createElement("strong");
      strong.dataset.role = role;
      strong.textContent = String(value);

      const labelNode = document.createElement("span");
      labelNode.dataset.role = `${role}-label`;
      labelNode.textContent = label;

      item.append(strong, labelNode);
      stats.appendChild(item);
    }

    addStat("activated-components", progress.activatedComponents, " aktiv");
    addStat("started-components", progress.startedComponents, " gestartet");
    addStat(
      "completed-components",
      progress.completedComponents,
      ` von ${progress.componentCount} abgeschlossen`
    );
    addStat(
      "completed-steps",
      progress.completedSteps,
      ` von ${progress.totalSteps} Schritten`
    );

    const bar = document.createElement("div");
    bar.className = "progress";

    const fill = document.createElement("span");
    fill.dataset.role = "plan-progress-fill";

    const percent = progress.totalSteps
      ? Math.round(100 * progress.completedSteps / progress.totalSteps)
      : 0;

    fill.style.width = `${Math.max(0, Math.min(100, percent))}%`;

    bar.appendChild(fill);
    stats.appendChild(bar);

    return stats;
  }

  // ---- Gesamt-Rendering der Ablaufplan-Ansicht ---------------------------------
  function renderPlanView(force = false) {
    const structureFingerprint = fingerprint(planStructureSnapshot());
    const runtimeFingerprint = fingerprint(planRuntimeSnapshot());

    const structureChanged =
      structureFingerprint !== planState.lastStructureFingerprint;

    const runtimeChanged =
      runtimeFingerprint !== planState.lastRuntimeFingerprint;

    if (!force && !structureChanged && !runtimeChanged) {
      return;
    }

    if (!force && !structureChanged && runtimeChanged) {
      planState.lastRuntimeFingerprint = runtimeFingerprint;
      updatePlanRuntimeOnly();
      return;
    }

    // Ab hier ist ein vollständiges Rebuild wirklich erforderlich.
    planState.lastStructureFingerprint = structureFingerprint;
    planState.lastRuntimeFingerprint = runtimeFingerprint;

    const container = $("#viewPlan");
    container.innerHTML = "";

    const progress = computePlanProgress();

    const toolbar = document.createElement("div"); toolbar.className = "planToolbar";
    const roomLabel = document.createElement("span"); roomLabel.textContent = "Raum:"; roomLabel.style.color = "var(--muted)";
    const roomSelect = document.createElement("select");
    roomSelect.disabled = planState.loading;
    const rooms = new Set([...devices.values()].map((e) => e.data.room));
    if (planState.room) rooms.add(planState.room);
    for (const r of [...rooms].sort()) {
      const o = document.createElement("option"); o.value = r; o.textContent = r;
      if (r === planState.room) o.selected = true;
      roomSelect.appendChild(o);
    }
    roomSelect.addEventListener("change", async () => {
      const nextRoom = roomSelect.value;
      if (planState.mode === "edit" && !confirm("Ungespeicherte Änderungen verwerfen und den gewählten Raum laden?")) {
        renderPlanView();
        return;
      }
      await initPlanView(true, nextRoom);
    });

    const reloadBtn = mkPlanBtn("Neu laden", async () => {
      if (planState.mode === "edit" && planState.loaded && !confirm("Ungespeicherte Änderungen verwerfen und vom Gerät neu laden?")) return;
      await initPlanView(true, planState.room);
    });
    const spacer = document.createElement("div"); spacer.className = "spacer";
    toolbar.append(roomLabel, roomSelect, reloadBtn);

    if (planState.mode === "edit") {
      const exportBtn = mkPlanBtn("Als JSON herunterladen", exportPlanJson);
      const importInput = document.createElement("input");
      importInput.type = "file"; importInput.accept = "application/json"; importInput.style.display = "none";
      importInput.addEventListener("change", importPlanJson);
      const importBtn = mkPlanBtn("JSON laden", () => importInput.click());
      const saveBtn = mkPlanBtn("Speichern (auf Geräte übertragen)", savePlanToDevices);
      toolbar.append(exportBtn, importBtn, importInput, spacer, saveBtn);
    } else {
      const resetRoomBtn = mkPlanBtn("Raum zurücksetzen", () => runPlanAction("reset", "", `Raum "${planState.room}" zurücksetzen`));
      resetRoomBtn.classList.add("danger");
      resetRoomBtn.disabled = planActionTargets("reset").length === 0;
      toolbar.append(spacer, resetRoomBtn);
    }

    const modeControl = document.createElement("label"); modeControl.className = "planModeControl";
    const viewLabel = document.createElement("span"); viewLabel.textContent = "Ansicht";
    if (planState.mode === "view") viewLabel.classList.add("active");
    const modeSwitch = document.createElement("span"); modeSwitch.className = "toggle-switch";
    const modeInput = document.createElement("input"); modeInput.type = "checkbox"; modeInput.checked = planState.mode === "edit";
    const slider = document.createElement("span"); slider.className = "slider";
    modeSwitch.append(modeInput, slider);
    const editLabel = document.createElement("span"); editLabel.textContent = "Bearbeiten";
    if (planState.mode === "edit") editLabel.classList.add("active");
    modeControl.append(viewLabel, modeSwitch, editLabel);
    modeInput.addEventListener("change", async () => {
      if (modeInput.checked) {
        planState.mode = "edit";
        renderPlanView();
        return;
      }
      if (!confirm("Bearbeitung beenden und ungespeicherte Änderungen verwerfen?")) {
        modeInput.checked = true;
        return;
      }
      planState.mode = "view";
      await initPlanView(true, planState.room);
    });
    toolbar.appendChild(modeControl);
    container.appendChild(toolbar);
    if (planState.mode === "view") container.appendChild(renderPlanStats(progress));

    const unassigned = [...planState.nodes.entries()].filter(([, node]) => !node.layer || !node.lane);
    if (planState.mode === "edit" || unassigned.length) {
      const pool = document.createElement("div"); pool.id = "planPool";
      const poolLabel = document.createElement("div"); poolLabel.className = "poolLabel";
      poolLabel.textContent = planState.mode === "edit" ? "Nicht zugeordnet (in eine Lane ziehen)" : "Nicht zugeordnet";
      pool.appendChild(poolLabel);
      for (const [uuid, node] of unassigned) {
        if (node.kind === "component" && node.available && planState.room && node.lastRoom !== planState.room) continue;
        pool.appendChild(renderPlanNodeChip(uuid, node, progress));
      }
      if (planState.mode === "edit") {
        pool.appendChild(mkPlanBtn("+ Dummy hinzufügen", addDummy));
        pool.addEventListener("dragover", (ev) => ev.preventDefault());
        pool.addEventListener("drop", (ev) => {
          ev.preventDefault();
          const node = planState.nodes.get(ev.dataTransfer.getData("text/plain"));
          if (!node) return;
          node.layer = null; node.lane = null;
          renderPlanView();
        });
      }
      container.appendChild(pool);
    }

    const canvas = document.createElement("div"); canvas.id = "planCanvas";
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.id = "planSvg";
    const layersWrap = document.createElement("div"); layersWrap.id = "planLayers";
    for (const layer of planState.layers) layersWrap.appendChild(renderPlanLayer(layer, progress));
    if (planState.mode === "edit") {
      const addLayerBtn = document.createElement("button");
      addLayerBtn.type = "button"; addLayerBtn.className = "planAddLayerBtn"; addLayerBtn.textContent = "+ Ebene";
      addLayerBtn.addEventListener("click", addLayer);
      layersWrap.appendChild(addLayerBtn);
    }
    canvas.append(svg, layersWrap);
    container.appendChild(canvas);

    if (!planState.layers.length && planState.mode === "view") {
      const empty = document.createElement("div"); empty.className = "state-text";
      empty.textContent = `Für Raum "${planState.room || "?"}" ist kein Ablaufplan gespeichert.`;
      container.appendChild(empty);
    }

    if (planState.mode === "edit") container.appendChild(renderVariablePanel());

    requestAnimationFrame(drawPlanConnections);
    invalidateRoomPlanCache();
  }

  // ---- Einstellungen-Dialog ------------------------------------------------------
  const dlg = $("#settingsDlg");
  $("#settingsBtn").addEventListener("click", () => {
    $("#settingsSrcInfo").textContent = location.protocol === "file:" ? "lokale, vertrauenswuerdige Datei" : location.origin;
    $("#pollInput").value = cfg.pollMs;
    $("#offlineInput").value = cfg.offlineMs;
    $("#sourceInput").value = cfg.source;
    $("#tokenInput").value = cfg.token;
    dlg.showModal();
  });
  $("#dlgCloseBtn").addEventListener("click", () => {
    let source;
    try {
      const parsed = new URL($("#sourceInput").value.trim());
      if (parsed.protocol !== "http:" && parsed.protocol !== "https:") throw new Error();
      source = parsed.origin;
    } catch {
      showToast("Geraetequelle muss eine vollstaendige HTTP(S)-URL sein", true);
      return;
    }
    cfg.pollMs = Number($("#pollInput").value) || DEFAULTS.pollMs;
    cfg.offlineMs = Number($("#offlineInput").value) || DEFAULTS.offlineMs;
    cfg.source = source;
    cfg.token = $("#tokenInput").value;
    localStorage.setItem("em.pollMs", cfg.pollMs);
    localStorage.setItem("em.offlineMs", cfg.offlineMs);
    localStorage.setItem("em.source", cfg.source);
    localStorage.removeItem("em.token");
    sessionStorage.setItem("em.token", cfg.token);
    securityCache.clear();
    invalidateGridCache();
    dlg.close();
    restartPolling();
  });

  // ---- Polling-Loop ------------------------------------------------------
  let timer = null;
  function restartPolling() {
    if (timer) clearInterval(timer);
    poll();
    timer = setInterval(poll, cfg.pollMs);
  }

  async function applyTokenFromUrl() {
    const { path, params } = hashParts();
    const token = params.get("token");
    if (token === null) return;

    params.delete("token");
    const cleanHash = path + (params.size ? "?" + params.toString() : "");
    history.replaceState(null, "", location.pathname + location.search + cleanHash);

    const tokenLength = new TextEncoder().encode(token).length;
    if (tokenLength < 8 || tokenLength > 128) {
      throw new Error("URL-Token muss 8 bis 128 Zeichen lang sein");
    }
    const response = await fetch(sourceUrl("/security.json"), { cache: "no-store" });
    if (!response.ok) throw new Error("URL-Token-Freigabe konnte nicht geprüft werden");
    const security = await response.json();
    if (security?.allowTokenInUrl !== true) {
      throw new Error("Token-Übernahme aus Links ist auf diesem Server deaktiviert");
    }
    cfg.token = token;
    sessionStorage.setItem("em.token", token);
    securityCache.clear();
  }

  async function start() {
    try {
      await applyTokenFromUrl();
    } catch (error) {
      showToast(error.message, true);
    }
    restartPolling();
    onRouteChange();
  }

  start();
})();
</script>
</body>
</html>
