<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EscapeManager</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e27; --panel2: #232733; --border: #313644;
    --text: #e7e9ee; --muted: #8b93a7; --ok: #3ecf6e; --warn: #f0b429; --err: #f0554e;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  #connDot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #connDot.ok { background: var(--ok); }
  #connDot.bad { background: var(--err); }
  #connInfo { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .navLink {
    color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 8px;
    border-radius: 6px;
  }
  .navLink:hover, .navLink.active { color: var(--text); background: var(--panel2); }
  #settingsBtn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  #settingsBtn:hover { border-color: var(--accent); }

  #tabs { display: flex; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; }
  .tab {
    padding: 6px 12px; border-radius: 999px; background: var(--panel);
    border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .count { opacity: .7; margin-left: 4px; }
  .tab.finished { margin-left: 6px; color: var(--ok); font-size: 12px; }

  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 12px; padding: 12px 16px 40px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .card.offline { opacity: .5; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .name { font-weight: 600; font-size: 15px; word-break: break-word; }
  .card .name a { color: inherit; text-decoration: none; }
  .card .name a:hover { text-decoration: underline; }
  .card .ip { color: var(--muted); font-size: 12px; }
  .card .top .gearBtn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .card .top .gearBtn:hover { border-color: var(--accent); color: var(--text); }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px;
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.err { background: rgba(240,85,78,.15); color: var(--err); border-color: var(--err); }
  .badge.offline { background: rgba(240,85,78,.15); color: var(--err); border-color: var(--err); }

  .battery { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .battery .bar { flex: 1; height: 6px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .battery .bar > span { display: block; height: 100%; background: var(--ok); }
  .battery.low .bar > span { background: var(--err); }
  .battery.mid .bar > span { background: var(--warn); }

  .errors { display: flex; flex-wrap: wrap; gap: 4px; }

  .puzzle { border-top: 1px solid var(--border); padding-top: 8px; }
  .puzzle .steps { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .progress { height: 6px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress > span { display: block; height: 100%; background: var(--accent); }
  .state-frame {
    width: 100%; height: clamp(25px, 20vw, 300px); min-height: 20px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: #000; display: block; overflow: hidden;
  }
  .state-text {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: auto;
  }
  .tip {
    background: rgba(240,180,41,.08); border-left: 3px solid var(--warn);
    padding: 7px 9px; font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }

  .feed a {
    color: var(--accent); font-size: 12px; text-decoration: none;
  }
  .feed a:hover { text-decoration: underline; }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .actions button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .actions button:hover { border-color: var(--accent); }
  .actions button:disabled { opacity: .5; cursor: default; }

  #empty { color: var(--muted); padding: 40px; text-align: center; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; max-width: 420px; width: 90%;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  dialog input {
    width: 100%; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text);
  }
  dialog select {
    width: 100%; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text);
  }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog button {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); cursor: pointer;
  }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  #toastStack {
    position: fixed; bottom: 16px; right: 16px; z-index: 20;
    display: flex; flex-direction: column-reverse; gap: 8px; max-width: 320px;
  }
  .toast {
    background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px;
  }
  .toast.err { border-color: var(--err); color: var(--err); }
  .toast.action { border-color: var(--accent); }
  .toast.plan { border-color: var(--ok); }
  .toast.config { border-color: var(--warn); }

  /* ---- Detailseite ---------------------------------------------------- */
  #viewDetail { padding: 12px 16px 40px; max-width: 720px; }
  #viewDetail .backLink { color: var(--muted); text-decoration: none; font-size: 13px; }
  #viewDetail .backLink:hover { text-decoration: underline; }
  #viewDetail h2 { margin: 10px 0 4px; }
  #viewDetail .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-top: 12px;
  }
  #viewDetail .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .kv .v { word-break: break-word; }
  #viewDetail .panel label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #viewDetail .panel input, #viewDetail .panel select {
    width: 100%; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text);
  }
  #viewDetail .panel button {
    margin-top: 12px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); cursor: pointer;
  }
  #viewDetail .panel button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #viewDetail .badge.warn { background: rgba(240,180,41,.15); color: var(--warn); border-color: var(--warn); }

  /* ---- Ablaufplan-Editor ------------------------------------------------ */
  #viewPlan { padding: 12px 16px 60px; }
  .planToolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .planToolbar select {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text);
  }
  .planActionBtn,
  .planToolbar button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: border-color .15s ease, background-color .15s ease, color .15s ease;
  }
  .planActionBtn:hover,
  .planToolbar button:hover { border-color: var(--accent); background: var(--panel2); }
  .planActionBtn:disabled,
  .planToolbar button:disabled { opacity: .45; cursor: default; border-color: var(--border); }
  .planActionBtn.danger,
  .planToolbar button.danger { color: var(--err); }
  .planToolbar .spacer { flex: 1; }
  .planModeControl { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .planModeControl .active { color: var(--text); font-weight: 600; }

  .planStats {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 2px 0 12px;
    color: var(--muted); font-size: 12px;
  }
  .planStats strong { color: var(--text); font-size: 16px; margin-right: 4px; }
  .planStats .progress { width: min(320px, 100%); margin: 0; flex: 1 1 220px; }

  #planPool {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; margin-bottom: 12px;
    background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; min-height: 44px;
  }
  #planPool .poolLabel { color: var(--muted); font-size: 12px; width: 100%; margin-bottom: 2px; }

  #planCanvas { position: relative; overflow: auto; padding-bottom: 20px; }
  #planLayers { display: flex; gap: 16px; align-items: flex-start; position: relative; z-index: 1; }
  #planSvg { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; overflow: visible; }
  .planLayer {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; min-width: 220px; flex: none;
  }
  .planLayer .layerHead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .planLayer .layerTitle { flex: 1; font-weight: 600; font-size: 13px; }
  .planLayer .layerActions { display: flex; gap: 4px; }
  .planLayer .layerActions button {
    background: transparent; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); cursor: pointer; padding: 3px 6px; font-size: 11px;
  }
  .planLayer .layerActions button:hover { border-color: var(--accent); color: var(--text); }
  .planLayer .layerActions button:disabled { opacity: .4; cursor: default; }
  .planLayer .layerHead input {
    flex: 1; background: transparent; border: none; color: var(--text); font-weight: 600; font-size: 13px;
  }
  .planLayer .layerHead button {
    background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .planLayer .layerHead button:hover { color: var(--err); }
  .planLane {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; margin-bottom: 8px; min-height: 50px;
  }
  .planLane.dragover { border-color: var(--accent); }
  .planLane .laneHead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .planLane .laneTitle { color: var(--muted); font-size: 12px; }
  .planLane .laneHead input {
    flex: 1; background: transparent; border: none; color: var(--muted); font-size: 12px;
  }
  .planLane .laneHead button {
    background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px;
  }
  .planAddLaneBtn, .planAddLayerBtn {
    width: 100%; background: transparent; border: 1px dashed var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px; cursor: pointer; font-size: 12px;
  }
  .planAddLaneBtn:hover, .planAddLayerBtn:hover { border-color: var(--accent); color: var(--text); }
  .planAddLayerBtn { min-width: 160px; align-self: stretch; }
  .planLayerDrop {
    border: 1px dashed var(--border); border-radius: 8px; padding: 8px;
    color: var(--muted); font-size: 11px; text-align: center;
  }
  .planLayerDrop.dragover { border-color: var(--accent); color: var(--text); }

  .planNode {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; margin-bottom: 6px; cursor: grab; font-size: 12px;
  }
  .planNode.view { cursor: default; }
  .planNode.dragging { opacity: .4; }
  .planNode.dummy { border-style: dashed; }
  .planNode.pending { opacity: .65; }
  .planNode.active { border-color: var(--accent); }
  .planNode.started { border-color: var(--warn); }
  .planNode.completed { border-color: var(--ok); background: rgba(62,207,110,.08); }
  .planNode .nodeName { font-weight: 600; }
  .planNode .nodeBadges { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .planNode .steps { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .planStepDot {
    width: 16px; height: 16px; border-radius: 50%; background: var(--panel2);
    border: 1px solid var(--border); color: var(--muted); font-size: 9px;
    display: flex; align-items: center; justify-content: center; cursor: crosshair; flex: none;
  }
  .planStepDot.connected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .planStepDot.done { background: var(--ok); border-color: var(--ok); color: #08170d; }
  .planStepDot.current { outline: 2px solid var(--warn); outline-offset: 1px; }
  .planStepDot.dragging-from { outline: 2px solid var(--accent); }
  .badge.ok { background: rgba(62,207,110,.12); color: var(--ok); border-color: var(--ok); }
  .badge.warn { background: rgba(240,180,41,.12); color: var(--warn); border-color: var(--warn); }

  .planVarPanel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-top: 16px;
  }
  .planVarRow { display: grid; grid-template-columns: auto minmax(120px, 1fr) minmax(140px, 1fr); gap: 8px; margin-bottom: 6px; align-items: center; }
  .planVarRow input, .planVarRow select {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 12px;
  }
  .planVarRow input[type="checkbox"] { width: 16px; height: 16px; padding: 0; }
  .planVarComponent { margin: 12px 0 6px; font-weight: 600; font-size: 12px; }
  .planVarRef { color: var(--muted); font-size: 10px; word-break: break-all; }

  @media (max-width: 600px) {
    #viewPlan { padding-left: 10px; padding-right: 10px; }
    .planToolbar .spacer { display: none; }
    .planModeControl { width: 100%; justify-content: flex-end; }
  }

  /* ---- Log (#/log) ------------------------------------------------------ */
  #viewLog { padding: 12px 16px 60px; max-width: 900px; }
  #viewLog .logToolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #viewLog select {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px;
  }
  #viewLog .logToolbar button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  #viewLog .logToolbar button:hover { border-color: var(--accent); }
  .logEntry {
    display: flex; gap: 10px; align-items: baseline; padding: 8px 10px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .logEntry .logTime { color: var(--muted); font-size: 11px; flex: none; width: 140px; }
  .logEntry .logBadge {
    flex: none; padding: 2px 7px; border-radius: 999px; font-size: 10px; text-transform: uppercase;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  }
  .logEntry .logBadge.action { color: var(--accent); border-color: var(--accent); }
  .logEntry .logBadge.plan { color: var(--ok); border-color: var(--ok); }
  .logEntry .logBadge.config { color: var(--warn); border-color: var(--warn); }
  .logEntry .logBadge.err { color: var(--err); border-color: var(--err); }
  .logEntry .logText { flex: 1; word-break: break-word; }
  #logEmpty { color: var(--muted); padding: 20px; text-align: center; }

  .toggleLabel {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: var(--text);
    font-size: 13px;
  }

  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex: none;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 22px;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }

  input:checked + .slider {
    background-color: #2196F3;
  }

  input:checked + .slider:before {
    transform: translateX(18px);
  }
</style>
</head>
<body>

<header>
  <h1>EscapeManager</h1>
  <span id="connDot"></span>
  <span id="connInfo">verbinde…</span>
  <div class="spacer"></div>
  <a id="navGrid" class="navLink" href="#/">Übersicht</a>
  <a id="navPlan" class="navLink" href="#/plan">Ablaufplan</a>
  <a id="navLog" class="navLink" href="#/log">Log</a>
  <button id="settingsBtn" type="button">Einstellungen</button>
</header>

<div id="viewGrid">
  <div id="tabs"></div>
  <div id="grid"></div>
  <div id="empty" hidden>Keine Komponenten gefunden.</div>
</div>

<div id="viewDetail" hidden></div>

<div id="viewPlan" hidden></div>

<div id="viewLog" hidden></div>

<dialog id="settingsDlg">
  <h3 style="margin-top:0">Einstellungen</h3>

  <label for="pollInput">Abfrageintervall (ms)</label>
  <input id="pollInput" type="number" min="500" step="500">

  <label for="offlineInput">Als "offline" markieren nach (ms)</label>
  <input id="offlineInput" type="number" min="1000" step="1000">

  <label for="sourceInput">Geraetequelle</label>
  <input id="sourceInput" type="url" placeholder="http://escapemanager.local">

  <label for="tokenInput">Auth-Token (venue-weit, siehe EscapeConfig.hpp)</label>
  <input id="tokenInput" type="password" placeholder="authentifiziert Schlüssel und verschlüsselte Requests">

  <p style="color:var(--muted); font-size:12px; margin-top:12px">Quelle: <span id="settingsSrcInfo"></span></p>

  <div class="row">
    <button id="dlgCloseBtn" type="button" class="primary">Schließen</button>
  </div>
</dialog>

<script>
(() => {
  "use strict";

  // Bei HTTP-Auslieferung bleibt ein MITM-Risiko. Die Anwendung bleibt auf
  // ausdruecklichen Wunsch nutzbar, weist aber sichtbar auf den Transport hin.
  const localHost = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname === "::1";
  if (location.protocol === "http:" && !localHost) {
    console.warn("EscapeManager wurde ueber unverschluesseltes HTTP geladen; die App-Integritaet ist nicht garantiert.");
  }

  // ---- Konfiguration ------------------------------------------------------
  const DEFAULTS = {
    pollMs: 3000,
    offlineMs: 15000,
    purgeMs: 120000,
    source: location.protocol === "file:" ? "http://escapemanager.local" : location.origin,
    token: "EscapeManager-Private-WLAN-Default-Token",
  };
  const cfg = {
    pollMs: Number(localStorage.getItem("em.pollMs")) || DEFAULTS.pollMs,
    offlineMs: Number(localStorage.getItem("em.offlineMs")) || DEFAULTS.offlineMs,
    source: localStorage.getItem("em.source") || DEFAULTS.source,
    // Venue-Schluessel nie dauerhaft im Web Storage halten. Er gilt nur fuer
    // die aktuelle Browser-Sitzung und verschwindet beim Schliessen des Tabs.
    token: sessionStorage.getItem("em.token") || DEFAULTS.token,
  };
  const MAX_DEVICES = 200;      // Schutz gegen überdimensionierte/böswillige Antworten
  const MAX_STR = 1000;          // Schutz gegen überlange Felder

  // key -> { data, lastSeen, room, actionBusy:Set }
  const devices = new Map();
  const cardRenderCache = new Map();
  const planSkeletonCache = new Map();
  const roomProgressCache = new Map();
  const skeletonCache = new Map();
  let activeRoom = "__all__";

  // Ablaufplan-Zustand (siehe renderPlanView() weiter unten). nodes ist
  // uuid -> {kind:"component"|"dummy", name, lastRoom, ip, id, totalSteps,
  // layer, lane, connections:[{step,layer,lane}], variables:{}, available}.
  const planState = {
    loaded: false,
    mode: "view",
    loading: false,
    loadSeq: 0,
    planId: "",
    room: "",
    layers: [],
    nodes: new Map(),
    variableCatalog: [],
    layerSeq: 0,
    laneSeq: 0,
    dummySeq: 0,
    lastStructureFingerprint: "",
    lastRuntimeFingerprint: "",
  };

  // ---- Hilfsfunktionen ------------------------------------------------------
  const $ = (sel) => document.querySelector(sel);

  function clip(v, max = MAX_STR) {
    if (typeof v !== "string") return "";
    return v.length > max ? v.slice(0, max) : v;
  }

  function safeActionName(name) {
    return typeof name === "string" && /^[\w\- ]{1,40}$/.test(name);
  }

  // Prueft/normalisiert den rohen Ablaufplan-Slice EINER Komponente (nicht
  // vertrauenswuerdige Netzwerkeingabe, siehe Client/client.hpp "plan"-Feld -
  // die Firmware validiert dessen Inhalt nicht, das muss also hier passieren).
  function sanitizePlanVariables(raw, componentUuid) {
    const variables = {};
    if (Array.isArray(raw)) {
      for (const item of raw.slice(0, 20)) {
        if (!item || typeof item !== "object") continue;
        const uuid = typeof item.uuid === "string" ? clip(item.uuid, 40) : "";
        const name = typeof item.name === "string" ? clip(item.name, 40) : "";
        if (!uuid || !name || (componentUuid && uuid !== componentUuid)) continue;
        variables[name] = { uuid, name, value: clip(String(item.value ?? ""), 200), enabled: item.enabled !== false };
      }
      return variables;
    }
    // Legacy-Slices referenzierten Variablen nur ueber ihren Namen. Beim
    // Laden wird die Komponenten-UUID ergaenzt und der bisher gespeicherte
    // Eintrag als aktiviert behandelt.
    if (raw && typeof raw === "object") {
      for (const [name, value] of Object.entries(raw)) {
        if (!name || name.length > 40) continue;
        variables[clip(name, 40)] = {
          uuid: componentUuid,
          name: clip(name, 40),
          value: clip(String(value?.value ?? value), 200),
          enabled: value?.enabled !== false,
        };
      }
    }
    return variables;
  }

  function sanitizePlanSlice(raw, componentUuid = "") {
    if (!raw || typeof raw !== "object") return null;
    const layer = typeof raw.layer === "string" ? clip(raw.layer, 40) : null;
    const lane = typeof raw.lane === "string" ? clip(raw.lane, 40) : null;
    const connections = Array.isArray(raw.connections)
      ? raw.connections.slice(0, 32).map((c) => {
          if (!c || typeof c !== "object") return null;
          if (!Number.isInteger(c.step) || typeof c.layer !== "string" || typeof c.lane !== "string") return null;
          return { step: c.step, layer: clip(c.layer, 40), lane: clip(c.lane, 40) };
        }).filter(Boolean)
      : [];
    const variables = sanitizePlanVariables(raw.variables, componentUuid);
    const planId = typeof raw.planId === "string" ? clip(raw.planId, 60) : "";
    return { planId, layer, lane, connections, variables };
  }

  // Prueft/normalisiert ein einzelnes Custom-Konfigurationsfeld einer
  // Komponente (nicht vertrauenswuerdige Netzwerkeingabe). Gibt null bei
  // unbrauchbaren/fremden Definitionen zurueck.
  function sanitizeCustomConfigDef(raw) {
    if (!raw || typeof raw !== "object") return null;
    const key = clip(raw.key, 40);
    if (!key || !/^[\w\-. ]{1,40}$/.test(key)) return null;
    const rawValue = clip(String(raw.value ?? ""), 4000);
    if (raw.type === "range") {
      const min = Number.isFinite(raw.min) ? raw.min : 0;
      const max = Number.isFinite(raw.max) ? raw.max : 0;
      if (max < min) return null;
      let value = Number(rawValue);
      if (!Number.isFinite(value)) value = min;
      value = Math.max(min, Math.min(max, value));
      return { key, type: "range", min, max, value: String(value) };
    }
    if (raw.type === "text") {
      const maxLength = Number.isFinite(raw.maxLength) ? Math.max(0, Math.min(4000, raw.maxLength)) : 0;
      return { key, type: "text", maxLength, value: clip(rawValue, maxLength || 4000) };
    }
    if (raw.type === "select") {
      const options = Array.isArray(raw.options)
        ? raw.options.slice(0, 20).map((o) => clip(String(o), 60)).filter(Boolean)
        : [];
      if (!options.length) return null;
      return { key, type: "select", options, value: options.includes(rawValue) ? rawValue : options[0] };
    }
    return null;
  }

  const wireTextEncoder = new TextEncoder();
  const wireTextDecoder = new TextDecoder();
  const wireSha256Constants = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2,
  ];

  function wireSha256(input) {
    const length = input.length;
    const paddedLength = Math.ceil((length + 9) / 64) * 64;
    const bytes = new Uint8Array(paddedLength);
    bytes.set(input);
    bytes[length] = 0x80;
    const view = new DataView(bytes.buffer);
    const bitLength = length * 8;
    view.setUint32(paddedLength - 8, Math.floor(bitLength / 0x100000000), false);
    view.setUint32(paddedLength - 4, bitLength >>> 0, false);

    const state = new Uint32Array([
      0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
      0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19,
    ]);
    const words = new Uint32Array(64);
    const rotateRight = (value, amount) => (value >>> amount) | (value << (32 - amount));
    for (let offset = 0; offset < paddedLength; offset += 64) {
      for (let index = 0; index < 16; index++) words[index] = view.getUint32(offset + index * 4, false);
      for (let index = 16; index < 64; index++) {
        const left = words[index - 15];
        const right = words[index - 2];
        const s0 = rotateRight(left, 7) ^ rotateRight(left, 18) ^ (left >>> 3);
        const s1 = rotateRight(right, 17) ^ rotateRight(right, 19) ^ (right >>> 10);
        words[index] = (words[index - 16] + s0 + words[index - 7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = state;
      for (let index = 0; index < 64; index++) {
        const sum1 = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
        const choice = (e & f) ^ (~e & g);
        const temp1 = (h + sum1 + choice + wireSha256Constants[index] + words[index]) >>> 0;
        const sum0 = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
        const majority = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (sum0 + majority) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }
      state[0] = (state[0] + a) >>> 0; state[1] = (state[1] + b) >>> 0;
      state[2] = (state[2] + c) >>> 0; state[3] = (state[3] + d) >>> 0;
      state[4] = (state[4] + e) >>> 0; state[5] = (state[5] + f) >>> 0;
      state[6] = (state[6] + g) >>> 0; state[7] = (state[7] + h) >>> 0;
    }
    const output = new Uint8Array(32);
    const outputView = new DataView(output.buffer);
    state.forEach((value, index) => outputView.setUint32(index * 4, value, false));
    return output;
  }

  function wireHmacSha256(key, message) {
    let keyBytes = wireTextEncoder.encode(key);
    if (keyBytes.length > 64) keyBytes = wireSha256(keyBytes);
    const innerKey = new Uint8Array(64);
    const outerKey = new Uint8Array(64);
    innerKey.fill(0x36); outerKey.fill(0x5c);
    for (let index = 0; index < keyBytes.length; index++) {
      innerKey[index] ^= keyBytes[index]; outerKey[index] ^= keyBytes[index];
    }
    const messageBytes = wireTextEncoder.encode(message);
    const inner = new Uint8Array(innerKey.length + messageBytes.length);
    inner.set(innerKey); inner.set(messageBytes, innerKey.length);
    const innerHash = wireSha256(inner);
    const outer = new Uint8Array(outerKey.length + innerHash.length);
    outer.set(outerKey); outer.set(innerHash, outerKey.length);
    return wireSha256(outer);
  }

  function wireBase64UrlEncode(bytes) {
    let binary = "";
    for (let offset = 0; offset < bytes.length; offset += 0x8000) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
    }
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function wireBase64UrlDecode(text) {
    if (typeof text !== "string" || text.includes("=") || text.length % 4 === 1) throw new Error("Base64URL ungueltig");
    const standard = text.replace(/-/g, "+").replace(/_/g, "/");
    const binary = atob(standard + "=".repeat((4 - standard.length % 4) % 4));
    return Uint8Array.from(binary, (character) => character.charCodeAt(0));
  }

  function openAuthenticatedDocument(context, document) {
    if (!cfg.token) throw new Error("Auth-Token nicht gesetzt");
    if (!document || document.v !== 1 || typeof document.payload !== "string" || typeof document.auth !== "string") {
      throw new Error("Authentifiziertes Dokument ungueltig");
    }
    const expected = wireHmacSha256(cfg.token, `EscapeManager document v1\n${context}\n${document.payload}`);
    const supplied = wireBase64UrlDecode(document.auth);
    if (supplied.length !== expected.length) throw new Error("Dokumentauthentifizierung fehlgeschlagen");
    let difference = 0;
    for (let index = 0; index < expected.length; index++) difference |= expected[index] ^ supplied[index];
    if (difference !== 0) throw new Error("Dokumentauthentifizierung fehlgeschlagen");
    return wireTextDecoder.decode(wireBase64UrlDecode(document.payload));
  }

  function randomRequestNonce() {
    const bytes = new Uint8Array(18);
    crypto.getRandomValues(bytes);
    return wireBase64UrlEncode(bytes);
  }

  function sourceUrl(path) {
    return cfg.source.replace(/\/+$/, "") + path;
  }

  function formatTimestamp(value, withDate = false) {
    const date = value === undefined ? new Date() : new Date(value);
    if (Number.isNaN(date.getTime())) {
      return withDate ? "unbekannt" : "--:--:--";
    }

    const pad2 = (num) => String(num).padStart(2, "0");
    const time = `${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}`;
    if (!withDate) return time;

    return `${pad2(date.getDate())}.${pad2(date.getMonth() + 1)}.${date.getFullYear()} ${time}`;
  }

  const getProtectionCache = new Map();

  async function authenticatedGetsRequired(url) {
    const origin = new URL(url, location.href).origin;
    if (getProtectionCache.has(origin)) return getProtectionCache.get(origin);
    const response = await fetch(origin + "/security.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Security-Info HTTP " + response.status);
    const security = await response.json();
    // Alte Geraete kennen das Feld noch nicht und verwenden ausschliesslich
    // den bisherigen geschuetzten GET-Modus.
    const required = security?.authenticatedGets !== false;
    getProtectionCache.set(origin, required);
    return required;
  }

  async function protocolGet(path) {
    return protocolGetUrl(sourceUrl(path), path);
  }

  async function protocolGetUrl(url, path) {
    const requireAuthentication = await authenticatedGetsRequired(url);
    const nonce = randomRequestNonce();
    const response = await fetch(url + "?nonce=" + nonce, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const document = await response.json();
    // Standardmodus: direktes JSON. Ist der GET-Schutz auf dem Ziel aktiviert,
    // bleibt die bisherige Token-HMAC-Pruefung unveraendert erhalten.
    if (!document || document.v !== 1 || typeof document.payload !== "string" || typeof document.auth !== "string") {
      if (requireAuthentication) throw new Error("Nicht authentifizierte GET-Antwort");
      return document;
    }
    const context = `http-get-v1\n${path}\n${nonce}\n${response.status}`;
    return JSON.parse(openAuthenticatedDocument(context, document));
  }

  function protocolDeviceGet(ip, httpPort, path) {
    return protocolGetUrl(deviceUrl(ip, httpPort, path), path);
  }

  function deviceUrl(ip, httpPort, path) {
    const port = Number.isInteger(httpPort) && httpPort !== 80 ? `:${httpPort}` : "";
    return `http://${ip}${port}${path}`;
  }

  async function getCachedPlanSkeleton(room, forceReload = false, showErrors = true) {

    const skeleton = await planLoadSkeleton(room, showErrors);
    const nextFingerprint = fingerprint(skeleton);

    if (cached && cached.fingerprint === nextFingerprint) {
      return cached.skeleton;

    planSkeletonCache.set(room, {
      fingerprint: nextFingerprint,
      skeleton,
      cachedAt: Date.now(),

    return skeleton;
  }

  // ---- Sicherer Schreibtransport -------------------------------------------
  // Der Public Key eines Geraets ist mit einem aus dem venue-weiten Token
  // abgeleiteten AES-GCM-Key verschluesselt und authentifiziert. Der Token
  // selbst wird nie gesendet.
  // Jeder POST verwendet ein frisches ephemeres P-256-Schluesselpaar und
  // AES-256-GCM; der Server bindet die Huelle kryptografisch an den Zielpfad.
  const securityCache = new Map();

  async function loadDeviceSecurity(ip, httpPort, force = false) {
    if (!window.EscapeCrypto) throw new Error("Browser-Kryptografie konnte nicht geladen werden");
    const origin = deviceUrl(ip, httpPort, "");
    const cached = securityCache.get(origin);
    if (!force && cached && cached.token === cfg.token) return cached.security;

    const response = await fetch(deviceUrl(ip, httpPort, "/security.json"), { cache: "no-store" });
    if (!response.ok) throw new Error("Public-Key HTTP " + response.status);
    const security = await response.json();
    if (security?.available === false || security?.readOnly === true) {
      throw new Error("Dieses Geraet ist nur lesbar: sichere Schreibzugriffe sind nicht verfuegbar");
    }
    const validShape = security && security.version === 2 && security.curve === "P-256" &&
      typeof security.keyId === "string" && /^[A-Za-z0-9_-]{16}$/.test(security.keyId) &&
      typeof security.salt === "string" && /^[A-Za-z0-9_-]{22}$/.test(security.salt) &&
      typeof security.iv === "string" && /^[A-Za-z0-9_-]{16}$/.test(security.iv) &&
      typeof security.encryptedPublicKey === "string" && /^[A-Za-z0-9_-]{108}$/.test(security.encryptedPublicKey);
    if (!validShape) throw new Error("Ungueltiges Public-Key-Dokument");
    let publicKey;
    try {
      publicKey = EscapeCrypto.decryptPublicKey(cfg.token, security);
    } catch {
      throw new Error("Public-Key-Authentifizierung fehlgeschlagen (Auth-Token pruefen)");
    }
    const authenticatedSecurity = { ...security, publicKey };
    securityCache.set(origin, { token: cfg.token, security: authenticatedSecurity });
    return authenticatedSecurity;
  }

  async function securePost(ip, httpPort, path, body, retryWithFreshKey = true) {
    const security = await loadDeviceSecurity(ip, httpPort);
    const plaintext = typeof body === "string" ? body : JSON.stringify(body);
    const envelope = EscapeCrypto.encryptRequest(
      cfg.token, security.publicKey, security.keyId, path, plaintext
    );
    const response = await fetch(deviceUrl(ip, httpPort, path), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(envelope),
    });

    // Boot-Schluessel sind absichtlich fluechtig. Falls das Ziel seit dem
    // letzten Request neu gestartet wurde, neuen authentifizierten Key holen
    // und genau einmal erneut verschluesseln.
    if (retryWithFreshKey && response.status === 400) {
      const payload = await response.clone().json().catch(() => null);
      if (payload?.error === "invalid secure envelope") {
        securityCache.delete(deviceUrl(ip, httpPort, ""));
        await loadDeviceSecurity(ip, httpPort, true);
        return securePost(ip, httpPort, path, body, false);
      }
    }

    let authenticatedResponse;
    try {
      authenticatedResponse = await response.json();
      const context = `http-post-response-v1\n${path}\n${envelope.iv}\n${response.status}`;
      const clearBody = openAuthenticatedDocument(context, authenticatedResponse);
      return { ok: response.ok, status: response.status, body: clearBody };
    } catch {
      throw new Error("Nicht authentifizierte Geraeteantwort (HTTP " + response.status + ")");
    }
  }

  // ---- Log (Aktionen/Ablaufplan-Aenderungen/Konfiguration/Meldungen) --------
  // Die Geraete selbst halten je Komponente nur das JEWEILS LETZTE Ereignis vor
  // (siehe evtSeq/evtMsg in Client/client.hpp) - eine vollstaendige Historie
  // waere dort wegen des knappen RAM (ESP32) nicht sinnvoll speicherbar. Die
  // vollstaendige Historie entsteht daher ausschliesslich hier: JEDE Meldung,
  // die dieser Manager waehrend seiner Laufzeit sieht (eigene Aktionen/
  // Konfigurationsaenderungen/Ablaufplan-Speicherungen ebenso wie von anderen
  // Managern ausgeloeste, per evtMsg empfangene Aenderungen), wird angehaengt
  // und lokal auf diesem Geraet zwischengespeichert (localStorage) - laeuft
  // der Manager nicht, entstehen fuer diesen Zeitraum keine Eintraege.
  const LOG_STORAGE_KEY = "em.log";
  const MAX_LOG_ENTRIES = 500;
  let logFilter = "";

  function loadLog() {
    try {
      const parsed = JSON.parse(localStorage.getItem(LOG_STORAGE_KEY) || "[]");
      if (!Array.isArray(parsed)) return [];
      return parsed.slice(0, MAX_LOG_ENTRIES).map((entry) => ({
        ts: Number.isFinite(entry?.ts) ? entry.ts : Date.now(),
        kind: clip(String(entry?.kind || "message"), 20),
        text: clip(String(entry?.text || ""), 300),
        isErr: !!entry?.isErr,
        room: clip(String(entry?.room || ""), 60),
        name: clip(String(entry?.name || ""), 60),
      }));
    } catch {
      return [];
    }
  }
  const activityLog = loadLog();

  function saveLog() {
    try {
      localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(activityLog.slice(0, MAX_LOG_ENTRIES)));
    } catch {
      // z.B. Speicherquote des Browsers voll - Log bleibt dann nur fuer diese Sitzung erhalten
    }
  }

  function logEvent(kind, text, isErr, room, name) {
    activityLog.unshift({
      ts: Date.now(), kind: kind || "message", text: clip(String(text), 300),
      isErr: !!isErr, room: room || "", name: name || "",
    });
    if (activityLog.length > MAX_LOG_ENTRIES) activityLog.length = MAX_LOG_ENTRIES;
    saveLog();
    if (currentRoute().view === "log") renderLogView();
  }

  // Ordnet eine vom Geraet empfangene evtMsg (siehe pushEvent() in
  // Client/client.hpp) einer Log-Kategorie zu, damit von ANDEREN Managern
  // ausgeloeste Aenderungen genauso kategorisiert im Log auftauchen wie
  // eigene.
  function classifyEventMsg(msg) {
    if (/^Aktion /.test(msg)) return "action";
    if (/Ablaufplan/.test(msg)) return "plan";
    if (/Konfiguration|Name\/Raum/.test(msg)) return "config";
    return "message";
  }

  // Baut aus einem {key: value}-Objekt eine kurze, lesbare Zusammenfassung
  // der KONKRETEN gesendeten Werte (nicht nur "Konfiguration geaendert") fuer
  // den Log-Eintrag.
  function formatConfigValues(values) {
    return Object.entries(values).map(([k, v]) => `${k}=${v}`).join(", ");
  }

  function showToast(msg, isErr, kind, room, name) {
    let stack = $("#toastStack");
    if (!stack) {
      stack = document.createElement("div");
      stack.id = "toastStack";
      document.body.appendChild(stack);
    }
    const t = document.createElement("div");
    t.className = "toast" + (isErr ? " err" : "") + (kind ? " " + kind : "");
    t.textContent = msg;
    stack.appendChild(t);
    setTimeout(() => t.remove(), 4000);
    logEvent(kind, msg, isErr, room, name);
  }

  // ---- Datenabruf ------------------------------------------------------
  async function poll() {
    try {
      const list = await protocolGet("/status.json");
      if (!Array.isArray(list)) throw new Error("Antwort ist kein Array");
      ingest(list);
      setConn(true);
    } catch (e) {
      setConn(false, e.message);
      console.error(e);
      console.trace();
    }
    render();
  }

  function ingest(list) {
    const now = Date.now();
    let n = 0;
    for (const raw of list) {
      if (n++ >= MAX_DEVICES) {
        showToast("Maximale Anzahl an Geräten erreicht", true, "", "", "")
        break;
      }
      if (!raw || typeof raw !== "object") continue;
      const ip = clip(raw.ip, 45);
      const name = clip(raw.name, 60);
      const room = clip(raw.room, 60) || "Ohne Raum";
      if (!ip || !name) continue;
      // Schluessel bewusst ohne IP: Komponenten behalten bei DHCP-Wechsel ihre
      // Identitaet (Name+Raum). Gilt unveraendert auch fuer Geraete mit
      // mehreren Komponenten (addComponent() in Client/client.hpp) - jede
      // Komponente eines Boards braucht dafuer einen eigenen Namen (wie schon
      // bisher zwischen verschiedenen Geraeten erforderlich).
      const key = room + "|" + name;

      const puzzleRaw = raw.puzzle && typeof raw.puzzle === "object" ? raw.puzzle : {};
      const uuid = typeof raw.uuid === "string" ? clip(raw.uuid, 40) : "";
      const data = {
        name, ip,
        httpPort: Number.isInteger(raw.httpPort) && raw.httpPort >= 1 && raw.httpPort <= 65535 ? raw.httpPort : 80,
        room,
        // Ein Geraet kann mehrere Komponenten anmelden (addComponent() in
        // Client/client.hpp) - id waehlt aus, welche davon /action bzw.
        // /config als Ziel betreffen soll (0, falls das Geraet nur eine hat).
        id: Number.isInteger(raw.id) ? raw.id : 0,
        slave: !!raw.slave,
        // stabile, von Name/Raum unabhaengige Identitaet (MAC-abgeleitet, siehe
        // Client/client.hpp) - Grundlage der Ablaufplan-Zuordnung.
        uuid,
        battery: Number.isFinite(raw.battery) ? Math.max(0, Math.min(100, raw.battery)) : 0,
        errors: Array.isArray(raw.errors) ? raw.errors.slice(0, 20).map((e) => clip(String(e), 100)) : [],
        actions: Array.isArray(raw.actions) ? raw.actions.slice(0, 20).map((a) => clip(String(a), 40)).filter(safeActionName) : [],
        planActions: Array.isArray(raw.planActions)
          ? raw.planActions.filter((action) => action === "reset" || action === "complete")
          : [],
        feed: /^https?:\/\//.test(raw.feed || "") ? clip(raw.feed, 300) : "",
        tip: typeof raw.tip === "string" ? clip(raw.tip, 1000) : "",
        puzzle: {
          totalSteps: Number.isFinite(puzzleRaw.totalSteps) ? puzzleRaw.totalSteps : null,
          step: Number.isFinite(puzzleRaw.step) ? puzzleRaw.step : null,
          state: clip(puzzleRaw.state, 4000),
          isHtml: !!puzzleRaw.isHtml,
        },
        customConfig: Array.isArray(raw.customConfig)
          ? raw.customConfig.slice(0, 12).map(sanitizeCustomConfigDef).filter(Boolean)
          : [],
        plan: sanitizePlanSlice(raw.plan, uuid),
        // Aktivitaets-Benachrichtigung (siehe LocalComponent::eventSeq in
        // Client/client.hpp): monoton steigender Zaehler + Klartext-Meldung des
        // zuletzt ausgeloesten Ereignisses (Aktion/Konfiguration/Ablaufplan),
        // von JEDEM Manager mitgesehen, der irgendeine Komponente desselben
        // Raums pollt - Grundlage der Benachrichtigung weiter unten.
        evtSeq: Number.isInteger(raw.evtSeq) ? raw.evtSeq : 0,
        evtMsg: typeof raw.evtMsg === "string" ? clip(raw.evtMsg, 200) : "",
      };
      const old_entry = devices.get(key)
      const entry = old_entry || { actionBusy: new Set() };
      const prevEvtSeq = entry.lastEvtSeq;
      entry.data = data;
      entry.lastSeen = now;
      devices.set(key, entry);
      if (!entry.securityPrimed) {
        entry.securityPrimed = true;
        loadDeviceSecurity(data.ip, data.httpPort).catch((error) => {
          console.warn(`Sicherer Transport fuer ${data.name} noch nicht bereit:`, error.message);
        });
      }

      if (data.evtSeq > 0) {
        if (prevEvtSeq === undefined) {
          entry.lastEvtSeq = data.evtSeq;
        } else if (data.evtSeq !== prevEvtSeq) {
          entry.lastEvtSeq = data.evtSeq;
          showToast(`${data.name} (${data.room}): ${data.evtMsg || "Änderung"}`, false, classifyEventMsg(data.evtMsg || ""), data.room, data.name);
        }
      }
    }
    // veraltete Einträge nach purgeMs endgültig entfernen
    for (const [key, entry] of devices) {
      if (now - entry.lastSeen > DEFAULTS.purgeMs) devices.delete(key);
    }

    const route = currentRoute();
    if (route.view === "detail") refreshDetail(route);
    if (route.view === "plan" && planState.loaded && planState.mode === "view" && !planState.loading) {
      mergeLiveComponents();
      renderPlanView();
    }
  }

  function setConn(ok, detail) {
    const dot = $("#connDot");
    const info = $("#connInfo");
    dot.className = ok ? "ok" : "bad";
    const src = location.origin;
    info.textContent = ok
      ? `verbunden mit ${src} · ${formatTimestamp()}`
      : `Fehler: ${detail} (${src})`;
  }

  // ---- Routing (Hash-basiert, rein clientseitig, keine echten Serverpfade) ---
  function hashParts() {
    const raw = (location.hash || "#/").slice(1);
    const queryStart = raw.indexOf("?");
    return {
      path: "#" + (queryStart >= 0 ? raw.slice(0, queryStart) : raw),
      params: new URLSearchParams(queryStart >= 0 ? raw.slice(queryStart + 1) : ""),
    };
  }

  function currentRoute() {
    const hash = hashParts().path;
    if (hash === "#/plan") return { view: "plan" };
    if (hash === "#/log") return { view: "log" };
    const m = hash.match(/^#\/component\/([^/]+)\/([^/]+)$/);
    if (m) return { view: "detail", room: decodeURIComponent(m[1]), name: decodeURIComponent(m[2]) };
    return { view: "grid" };
  }

  function componentUrl(room, name) {
    return "#/component/" + encodeURIComponent(room) + "/" + encodeURIComponent(name);
  }

  function showView(view) {
    $("#viewGrid").hidden = view !== "grid";
    $("#viewDetail").hidden = view !== "detail";
    $("#viewPlan").hidden = view !== "plan";
    $("#viewLog").hidden = view !== "log";
    $("#navGrid").classList.toggle("active", view === "grid" || view === "detail");
    $("#navPlan").classList.toggle("active", view === "plan");
    $("#navLog").classList.toggle("active", view === "log");
  }

  // Bei jedem Wechsel der Route (Klick auf einen Link, Browser-Zurueck) wird
  // die Ziel-Ansicht einmal komplett neu aufgebaut.
  function onRouteChange() {
    const route = currentRoute();
    if (route.view === "plan") {
      showView("plan");
      initPlanView(!planState.loaded);
    } else if (route.view === "detail") {
      showView("detail");
      renderDetail(route);
    } else if (route.view === "log") {
      showView("log");
      renderLogView();
    } else {
      showView("grid");
      renderTabs();
      renderGrid();
    }
  }
  window.addEventListener("hashchange", onRouteChange);

  // ---- Log-Ansicht (#/log) ------------------------------------------------
  const LOG_KIND_LABELS = { action: "Aktion", plan: "Ablaufplan", config: "Konfiguration", message: "Meldung" };

  function renderLogView() {
    const container = $("#viewLog");
    container.innerHTML = "";

    const toolbar = document.createElement("div");
    toolbar.className = "logToolbar";
    const filterSelect = document.createElement("select");
    for (const [value, label] of [["", "Alle"], ["action", "Aktionen"], ["plan", "Ablaufplan"], ["config", "Konfiguration"], ["message", "Meldungen"]]) {
      const o = document.createElement("option");
      o.value = value; o.textContent = label;
      if (value === logFilter) o.selected = true;
      filterSelect.appendChild(o);
    }
    filterSelect.addEventListener("change", () => { logFilter = filterSelect.value; renderLogView(); });
    const clearBtn = document.createElement("button");
    clearBtn.type = "button"; clearBtn.textContent = "Log leeren";
    clearBtn.addEventListener("click", () => {
      if (!confirm("Log-Verlauf auf diesem Gerät wirklich löschen?")) return;
      activityLog.length = 0;
      saveLog();
      renderLogView();
    });
    toolbar.append(filterSelect, clearBtn);
    container.appendChild(toolbar);

    const filtered = logFilter ? activityLog.filter((e) => e.kind === logFilter) : activityLog;
    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.id = "logEmpty";
      empty.textContent = "Noch keine Einträge - Aktionen, Konfigurations-/Ablaufplan-Änderungen und Meldungen erscheinen hier, während dieser Manager läuft.";
      container.appendChild(empty);
      return;
    }
    const list = document.createElement("div");
    for (const e of filtered) {
      const row = document.createElement("div");
      row.className = "logEntry";
      const time = document.createElement("div");
      time.className = "logTime"; time.textContent = formatTimestamp(e.ts, true);
      const badge = document.createElement("span");
      badge.className = "logBadge " + e.kind + (e.isErr ? " err" : "");
      badge.textContent = LOG_KIND_LABELS[e.kind] || e.kind;
      const text = document.createElement("div");
      text.className = "logText";
      text.textContent = (e.room ? `[${e.room}${e.name ? "/" + e.name : ""}] ` : "") + e.text;
      row.append(time, badge, text);
      list.appendChild(row);
    }
    container.appendChild(list);
  }

  // ---- Rendering ------------------------------------------------------
  // Wird nach jedem Poll aufgerufen: die Uebersicht wird hier aktualisiert;
  // die Detailseite bereits direkt nach erfolgreichem ingest(), damit dort
  // lokale Eingaben selektiv erhalten werden koennen (siehe refreshDetail()).
  // Der Ablaufplan bleibt waehrend Drag&Drop-Interaktionen unveraendert.
  function render() {
    if (currentRoute().view === "grid") {
      renderTabs();
      renderGrid();
    }
  }

  let lastTabsFingerprint = "";

  function tabsViewModel() {
    const rooms = {};

    for (const [, entry] of devices) {
      const room = entry.data.room;
      rooms[room] = (rooms[room] || 0) + 1;
    }

    return {
      activeRoom,
      rooms,
    };
  }

  async function renderTabs() {
    const rooms = new Map();

    for (const [, entry] of devices) {
      rooms.set(entry.data.room, (rooms.get(entry.data.room) || 0) + 1);
    }

    if (!rooms.has(activeRoom) && activeRoom !== "__all__") {
      activeRoom = "__all__";
    }

    const tabs = $("#tabs");
    tabs.innerHTML = "";

    tabs.appendChild(mkTab("__all__", "Alle Räume", devices.size));

    const tabElements = {};

    const sortedRooms = [...rooms.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]));

    for (const [room, count] of sortedRooms) {
      const tab = mkTab(room, room, count);
      tabElements[room] = tab;
      tabs.appendChild(tab);
    }

    // Den aktuell geladenen Planraum merken, damit die Planansicht
    // nach der Fortschrittsberechnung wieder korrekt bleibt.
    const previousRoom = planState.room;

    for (const [room] of sortedRooms) {
      try {
        const roomProgress = await getRoomProgress(room);

        if (roomProgress.finished) {
          tabElements[room].classList.add("finished");
        }
      } catch (error) {
        console.error(
          `Fehler beim Abrufen des Planfortschritts für Raum "${room}":`,
          error
        );
      }
    }

    // Falls gerade ein Plan offen ist, vorherigen Raum wiederherstellen.
    if (previousRoom) {
      await initPlanView(false, previousRoom, false);
    }
  }

  function mkTab(id, label, count) {
    const el = document.createElement("div");
    el.className = "tab" + (activeRoom === id ? " active" : "");
    el.textContent = label + " ";
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = `(${count})`;
    el.appendChild(c);
    el.addEventListener("click", () => { activeRoom = id; render(); });
    return el;
  }

  function renderGrid() {
    const now = Date.now();
    const grid = $("#grid");

    const list = [...devices.entries()]
      .filter(([, entry]) =>
        activeRoom === "__all__" || entry.data.room === activeRoom
      )
      .sort(([, a], [, b]) => a.data.name.localeCompare(b.data.name));

    $("#empty").hidden = list.length !== 0;

    const visibleKeys = new Set();

    for (const [key, entry] of list) {
      visibleKeys.add(key);

      const nextFingerprint = fingerprint(cardViewModel(entry, now));
      const cached = cardRenderCache.get(key);

      let card;

      if (cached && cached.fingerprint === nextFingerprint) {
        // Unverändert: vorhandenes DOM-Element weiterverwenden.
        card = cached.element;
      } else {
        // Neu oder verändert: nur diese Karte neu bauen.
        const nextCard = renderCard(entry, now);

        if (cached?.element?.isConnected) {
          cached.element.replaceWith(nextCard);
        }

        card = nextCard;
        cardRenderCache.set(key, {
          fingerprint: nextFingerprint,
          element: card,
        });
      }

      // appendChild verschiebt vorhandene Elemente nur bei Bedarf und erhält
      // damit die gewünschte Sortierung ohne das komplette Grid neu zu bauen.
      grid.appendChild(card);
    }

    // Karten entfernen, die nicht mehr angezeigt werden oder gelöscht wurden.
    for (const [key, cached] of cardRenderCache) {
      if (!visibleKeys.has(key)) {
        cached.element.remove();
        cardRenderCache.delete(key);
      }
    }
  }

  function invalidateGridCache() {
    cardRenderCache.clear();
  }

  function renderCard(entry, now) {
    const d = entry.data;
    const offline = now - entry.lastSeen > cfg.offlineMs;

    const card = document.createElement("div");
    card.className = "card" + (offline ? " offline" : "");

    const top = document.createElement("div");
    top.className = "top";
    const nameWrap = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    const nameLink = document.createElement("a");
    nameLink.href = componentUrl(d.room, d.name);
    nameLink.textContent = d.name;
    name.appendChild(nameLink);
    const ip = document.createElement("div");
    ip.className = "ip"; ip.textContent = d.ip + " · " + d.room + " · ID " + d.id;
    nameWrap.append(name, ip);
    top.appendChild(nameWrap);

    const statusGroup = document.createElement("div");
    statusGroup.style.display = "flex";
    statusGroup.style.alignItems = "center";
    statusGroup.style.gap = "6px";
    if (offline) {
      const b = document.createElement("span");
      b.className = "badge offline"; b.textContent = "offline";
      statusGroup.appendChild(b);
    }
    const gearBtn = document.createElement("button");
    gearBtn.type = "button"; gearBtn.className = "gearBtn"; gearBtn.title = "Details/Einstellungen";
    gearBtn.textContent = "⚙";
    gearBtn.addEventListener("click", () => { location.hash = componentUrl(d.room, d.name); });
    statusGroup.appendChild(gearBtn);
    top.appendChild(statusGroup);
    card.appendChild(top);

    if (d.battery > 0) {
      const batt = document.createElement("div");
      batt.className = "battery" + (d.battery < 20 ? " low" : d.battery < 50 ? " mid" : "");
      const bar = document.createElement("div");
      bar.className = "bar";
      const span = document.createElement("span");
      span.style.width = Math.max(0, Math.min(100, d.battery)) + "%";
      bar.appendChild(span);
      const label = document.createElement("span");
      label.textContent = d.battery + "%";
      batt.append(bar, label);
      card.appendChild(batt);
    }

    if (d.errors.length) {
      const errs = document.createElement("div");
      errs.className = "errors";
      for (const e of d.errors) {
        const b = document.createElement("span");
        b.className = "badge err"; b.textContent = e;
        errs.appendChild(b);
      }
      card.appendChild(errs);
    }

    if (d.puzzle.totalSteps != null) {
      const p = document.createElement("div");
      p.className = "puzzle";
      const steps = document.createElement("div");
      steps.className = "steps";
      steps.innerHTML = "";
      const l = document.createElement("span"); l.textContent = "Rätsel";
      const r = document.createElement("span"); r.textContent = `${d.puzzle.step ?? "?"} / ${d.puzzle.totalSteps}`;
      steps.append(l, r);
      p.appendChild(steps);

      const prog = document.createElement("div");
      prog.className = "progress";
      const progSpan = document.createElement("span");
      const pct = d.puzzle.totalSteps ? Math.round(100 * (d.puzzle.step || 0) / d.puzzle.totalSteps) : 0;
      progSpan.style.width = Math.max(0, Math.min(100, pct)) + "%";
      prog.appendChild(progSpan);
      p.appendChild(prog);

      if (d.puzzle.state) {
        if (d.puzzle.isHtml) {
          // sandbox ohne allow-scripts/allow-same-origin: HTML/CSS wird gerendert,
          // aber JS aus Spieler-Eingaben kann nicht ausgeführt werden (XSS-Schutz).
          const frame = document.createElement("iframe");
          frame.className = "state-frame";
          frame.setAttribute("sandbox", "");
          frame.setAttribute("srcdoc", "<style>html,body{margin:0;padding:0;} body{display:flex;justify-content:center;align-items:flex-start;} svg{display:block;height:auto;width:auto;}</style>" + d.puzzle.state);
          p.appendChild(frame);
        } else {
          const txt = document.createElement("div");
          txt.className = "state-text";
          txt.textContent = d.puzzle.state; // niemals innerHTML für Fremdtext
          p.appendChild(txt);
        }
      }
      card.appendChild(p);
    }

    if (d.feed) {
      const feed = document.createElement("div");
      feed.className = "feed";
      const a = document.createElement("a");
      a.href = d.feed; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "Live-Feed öffnen ↗";
      feed.appendChild(a);
      card.appendChild(feed);
    }

    if (d.tip) {
      const tip = document.createElement("div");
      tip.className = "tip";
      const label = document.createElement("strong");
      label.textContent = "Hinweis: ";
      tip.append(label, document.createTextNode(d.tip));
      card.appendChild(tip);
    }

    if (d.actions.length) {
      const actions = document.createElement("div");
      actions.className = "actions";
      for (const action of d.actions) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = action;
        btn.disabled = entry.actionBusy.has(action);
        btn.addEventListener("click", () => sendAction(entry, d, action, btn));
        actions.appendChild(btn);
      }
      card.appendChild(actions);
    }

    return card;
  }

  async function sendAction(entry, d, action, btn) {
    entry.actionBusy.add(action);
    btn.disabled = true;
    try {
      const res = await securePost(d.ip, d.httpPort, "/action", { id: d.id, action });
      if (!res.ok) throw new Error("HTTP " + res.status);
      showToast(`"${action}" an ${d.name} gesendet`, false, "action", d.room, d.name);
    } catch (e) {
      showToast(`Fehler bei "${action}" an ${d.name}: ${e.message}`, true, "action", d.room, d.name);
    } finally {
      entry.actionBusy.delete(action);
      btn.disabled = false;
    }
  }

  // ---- Detailseite (#/component/<room>/<name>) --------------------------------
  function editableFieldValue(field) {
    return field.type === "checkbox" ? String(field.checked) : field.value;
  }

  // Merkt ausschliesslich Felder, die der Benutzer seit dem letzten vom
  // Server gerenderten Wert wirklich veraendert hat. Fokus/Cursor werden
  // separat erhalten, auch wenn das aktive Feld noch unveraendert ist.
  function captureDetailEdits() {
    const container = $("#viewDetail");
    const edits = new Map();
    let focus = null;
    for (const field of container.querySelectorAll("[data-edit-key]")) {
      const key = field.dataset.editKey;
      const value = editableFieldValue(field);
      if (value !== field.dataset.serverValue) edits.set(key, value);
      if (field === document.activeElement) {
        focus = { key };
        if (typeof field.selectionStart === "number") {
          focus.start = field.selectionStart;
          focus.end = field.selectionEnd;
        }
      }
    }
    return { edits, focus };
  }

  function restoreDetailEdits(state) {
    if (!state) return;
    const fields = [...$("#viewDetail").querySelectorAll("[data-edit-key]")];
    for (const [key, value] of state.edits) {
      const field = fields.find((candidate) => candidate.dataset.editKey === key);
      if (!field) continue;
      if (field.type === "checkbox") {
        field.checked = value === "true";
      } else {
        if (field.tagName === "SELECT" && ![...field.options].some((option) => option.value === value)) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          field.appendChild(option);
        }
        field.value = value;
      }
    }
    if (!state.focus) return;
    const field = fields.find((candidate) => candidate.dataset.editKey === state.focus.key);
    if (!field) return;
    field.focus({ preventScroll: true });
    if (state.focus.start !== undefined && typeof field.setSelectionRange === "function") {
      field.setSelectionRange(state.focus.start, state.focus.end);
    }
  }

  function markDetailField(field, key, serverValue) {
    field.dataset.editKey = key;
    field.dataset.serverValue = String(serverValue);
    return field;
  }

  function refreshDetail(route) {
    const state = captureDetailEdits();
    renderDetail(route);
    restoreDetailEdits(state);
  }

  function renderDetail(route) {
    const container = $("#viewDetail");
    container.innerHTML = "";

    const back = document.createElement("a");
    back.className = "backLink"; back.href = "#/"; back.textContent = "← Zur Übersicht";
    container.appendChild(back);

    const key = route.room + "|" + route.name;
    const entry = devices.get(key);
    if (!entry) {
      const p = document.createElement("p");
      p.style.color = "var(--muted)";
      p.textContent = `Komponente "${route.name}" (${route.room}) wurde noch nicht empfangen - warte auf nächsten Broadcast…`;
      container.appendChild(p);
      const refresh = document.createElement("a");
      refresh.className = "backLink"; refresh.href = "#"; refresh.textContent = "Aktualisieren";
      refresh.addEventListener("click", (ev) => { ev.preventDefault(); renderDetail(route); });
      container.appendChild(refresh);
      return;
    }
    const d = entry.data;

    const h2 = document.createElement("h2"); h2.textContent = d.name;
    container.appendChild(h2);

    const infoPanel = document.createElement("div"); infoPanel.className = "panel";
    const infoTitle = document.createElement("h3"); infoTitle.textContent = "Status"; infoPanel.appendChild(infoTitle);
    const kv = document.createElement("div"); kv.className = "kv";
    const rows = [
      ["IP", d.ip],
      ["Komponenten-ID", String(d.id)],
      ["UUID", d.uuid || "(unbekannt)"],
      ["Raum", d.room],
      ["Batterie", d.battery > 0 ? d.battery + "%" : "unbekannt/Netzbetrieb"],
    ];
    for (const [k, v] of rows) {
      const kEl = document.createElement("div"); kEl.className = "k"; kEl.textContent = k;
      const vEl = document.createElement("div"); vEl.className = "v"; vEl.textContent = v;
      kv.append(kEl, vEl);
    }
    infoPanel.appendChild(kv);
    if (d.errors.length) {
      const errs = document.createElement("div");
      errs.className = "errors"; errs.style.marginTop = "10px";
      for (const e of d.errors) {
        const b = document.createElement("span"); b.className = "badge err"; b.textContent = e;
        errs.appendChild(b);
      }
      infoPanel.appendChild(errs);
    }
    container.appendChild(infoPanel);

    if (d.puzzle.totalSteps != null) {
      const p = document.createElement("div"); p.className = "panel";
      const t = document.createElement("h3"); t.textContent = "Rätsel"; p.appendChild(t);
      const steps = document.createElement("div");
      steps.textContent = `Schritt ${d.puzzle.step ?? "?"} / ${d.puzzle.totalSteps}`;
      p.appendChild(steps);
      if (d.puzzle.state) {
        if (d.puzzle.isHtml) {
          const frame = document.createElement("iframe");
          frame.className = "state-frame"; frame.setAttribute("sandbox", "");
          frame.setAttribute("srcdoc", "<style>html,body{margin:0;padding:0;background:#0f172a;overflow:hidden;} body{display:flex;justify-content:center;align-items:flex-start;} svg{display:block;max-width:100%;height:auto;width:100%;max-height:100%;}</style>" + d.puzzle.state);
          frame.style.marginTop = "8px";
          p.appendChild(frame);
        } else {
          const txt = document.createElement("div");
          txt.className = "state-text"; txt.style.marginTop = "8px"; txt.textContent = d.puzzle.state;
          p.appendChild(txt);
        }
      }
      container.appendChild(p);
    }

    if (d.feed) {
      const p = document.createElement("div"); p.className = "panel";
      const t = document.createElement("h3"); t.textContent = "Live-Feed"; p.appendChild(t);
      const a = document.createElement("a");
      a.href = d.feed; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "Feed öffnen ↗"; a.style.color = "var(--accent)";
      p.appendChild(a);
      container.appendChild(p);
    }

    if (d.tip) {
      const p = document.createElement("div"); p.className = "panel";

    const idPanel = document.createElement("div"); idPanel.className = "panel";
