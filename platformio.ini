; PlatformIO-Projektkonfiguration fuer die Escape-Room-Komponenten (ESP32).
; Board bei Bedarf auf das tatsaechlich verwendete ESP32-Modul anpassen.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Keine externen lib_deps mehr noetig: das JSON-Wire-Format wird seit der
; Aufteilung in Client/Json.hpp+cpp/Protocol.hpp+cpp selbst implementiert
; (abhaengigkeitsfrei, portabel), damit dieselbe Implementierung auch vom
; PC-Simulator (Sim/escape_component_sim.cpp per plain g++) genutzt werden kann.

; Bettet manager/manager.html als Binaerblob ins Flash (.rodata) ein, sodass
; jede Komponente die Datei unveraendert unter GET / ausliefern kann, ohne sie
; als C-String zu duplizieren. Erzeugt die Symbole
; _binary_Manager_manager_html_start/_end (siehe Client/HardwareEsp32.cpp).
board_build.embed_files = src/manager/manager.html

; PlatformIO kompiliert standardmaessig ALLE .cpp unter src_dir (= "src"),
; seit dem Umzug von Client/Sim/Manager nach src/esp, src/sim, src/manager
; also auch src/sim/escape_component_sim.cpp - der PC-Simulator nutzt aber
; POSIX-Sockets (arpa/inet.h, sys/socket.h, ...) und definiert ein eigenes
; main(), was mit dem Arduino-Framework kollidiert (fehlende Header bzw.
; "multiple definition of main"). Der Sim wird separat per g++ gebaut (siehe
; src/sim/escape_component_sim.cpp Kopfkommentar), daher hier explizit aus dem
; ESP32-Firmware-Build ausschliessen.
build_src_filter = +<*> -<sim/>
