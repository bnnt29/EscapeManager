name=EscapeManager
version=2.1.1
author=Bennet Richter
maintainer=Bennet Richter <berniad294@gmail.com>
sentence=Connects ESP32 escape-room puzzles to a browser manager: no server, every board serves the UI.
paragraph=Each board announces itself over UDP, answers authenticated (AES-GCM / HMAC) requests, serves the manager page and stores plans. Wi-Fi is set up through the board's own setup network when needed. Runs next to your own code in loop(): no extra task, no blocking calls.
