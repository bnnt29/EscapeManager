; PlatformIO project of the EscapeManager library itself (development, tests, examples, maintenance tools).
; USERS of the library do not need this file: add `lib_deps = https://github.com/bnnt29/EscapeManager.git` to their
; own platformio.ini (README "Installation"). The sketches live in examples/ (Arduino IDE layout); the environments
; below build them through the tiny wrappers in scripts/pio_shims/.
;
; Important commands:
;   pio run -e esp-dummy -t upload      complete demo firmware on real hardware
;   pio run -e minimal -t upload        the smallest useful sketch
;   pio test -e native                  portable protocol tests on the PC (with sanitizers)
;   pio test -e esp32-test              the same tests on a real ESP32
;
; Local credentials and build flags (Wi-Fi, tokens) belong into the UNTRACKED secrets.ini
; (template: secrets.ini.example) - never commit them.
[platformio]
default_envs = esp-dummy
; "secrets.in[i]" instead of "secrets.ini": a glob pattern that matches nothing (and is no error) when the file does not exist.
extra_configs = secrets.in[i]

; ---- Shared ESP32 settings ------------------------------------------
; Pins platform and framework for reproducible builds (Arduino-ESP32 2.0.17). The Arduino-ESP32 3.x setup
; (pioarduino) is built by [env:esp-dummy-arduino3]; the library has to compile with BOTH cores.
[esp32_common]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two OTA slots + plan_nvs (skeletons) + coredump. The partition table belongs to the host program - see
; partitions.csv and the README. It is OPTIONAL: the library also runs with the default tables.
board_build.partitions = partitions.csv
; Library code of the firmware: protocol + portable network core + ESP platform layer +
; the embedded UI. The PC simulator and the Python device (extras/) and the examples are not part of it.
build_src_filter = +<esp/> +<protocol/> +<net/> +<manager/ui_data.cpp>
build_flags = ${env.build_flags}
; Regenerates the embedded manager UI (src/manager/ui_data.cpp) when manager.html changed.
extra_scripts = pre:scripts/build_ui.py
; (the UI is embedded as a C array by src/manager/ui_data.cpp - no embed_files needed)

; ---- Normal development / demo image ---------------------------------------
; Complete firmware with two SIMULATED components for real hardware (real Wi-Fi, HTTP, UDP discovery, mDNS,
; security - only the puzzle logic is simulated):
;   pio run -e esp-dummy -t upload && pio device monitor
[env:esp-dummy]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/EspDummy.cpp>

; The smallest useful sketch (examples/Minimal).
[env:minimal]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/Minimal.cpp>

; Like esp-dummy, but with Arduino-ESP32 3.x (pioarduino; needs PlatformIO under Python <= 3.13).
[env:esp-dummy-arduino3]
extends = esp32_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/EspDummy.cpp>

; Worst case for memory/timing tests: 4 components, all text fields at their limits (examples/EspDummy, ESCAPE_DEMO_MAX).
[env:esp-dummy-max]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/EspDummy.cpp>
build_flags = ${env.build_flags} -DESCAPE_DEMO_MAX=1

; The device clock starts 65 s before the 32-bit millisecond wrap (49.7 days): run scripts/hw_wrap_test.mjs.
[env:esp-dummy-wrap]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/EspDummy.cpp>
build_flags = ${env.build_flags} -DESCAPE_CLOCK_OFFSET_MS=0xFFFF0000UL

; Demo firmware with the Arduino core's DEFAULT partition table (no plan_nvs): all persistent data
; must fit into the 20 KB default NVS. Used to measure how many plan skeletons fit (see HARDWARE_TODO.md).
[env:esp-dummy-defaultnvs]
extends = esp32_common
board_build.partitions = default.csv
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/EspDummy.cpp>

; Host program that owns Wi-Fi ITSELF (examples/HostManagedWifi): opt-in with -DESCAPE_HOST_MANAGED_WIFI=1 (or
; EscapeComponent::useHostManagedWifi() before begin()). The library then never touches the radio and offers
; no setup network. The example connects with ESCAPE_WIFI_SSID / ESCAPE_WIFI_PASSWORD (secrets.ini).
[env:host-managed-wifi]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/HostManagedWifi.cpp>
build_flags = ${env.build_flags} -DESCAPE_HOST_MANAGED_WIFI=1

; Build-time settings: tokens baked into the build (normally from secrets.ini) and a WPA2 password for the setup
; network (empty = open, the default). With a secrets.ini the compiler reports "redefined" for these three and the
; LAST definition (this one) wins; do not use -U here: PlatformIO would apply it after ALL -D flags.
[env:esp-dummy-tokens]
extends = esp32_common
build_src_filter = ${esp32_common.build_src_filter} +<../scripts/pio_shims/EspDummy.cpp>
build_flags =
  ${env.build_flags}
  -DESCAPE_AUTH_TOKEN=\"a-build-time-token-1\"
  -DESCAPE_EDIT_TOKEN=\"an-edit-token-for-builds\"
  -DESCAPE_SETUP_AP_PASSWORD=\"setup-pass-123\"

; ---- Tests ------------------------------------------------------------------
; Portable core (src/protocol, src/net) on the PC. Cryptography through the OpenSSL backend (libssl-dev),
; sanitizers catch memory and undefined-behaviour errors.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore = test_esp   ; needs a real ESP32 (esp32-test-esp)
build_src_filter = -<*> +<protocol/> +<net/> +<../extras/sim/OpenSslCryptoBackend.cpp>
build_flags =
  -std=gnu++11
  -g -O1
  -Wall -Wextra -Wno-unused-parameter
  -fsanitize=address,undefined -fno-omit-frame-pointer
  -Isrc
  -DESCAPE_NATIVE=1
  -lcrypto

; The same tests on a real ESP32 (mbedTLS backend, real toolchain). Also measures stack/heap/time against the budget.
[env:esp32-test]
extends = esp32_common
test_framework = unity
test_build_src = yes
test_filter = test_core
build_src_filter = -<*> +<protocol/> +<esp/MbedTlsCryptoBackend.cpp>
extra_scripts =

; Configuration precedence on a real board (test/test_esp): stored on the device > sketch > build flag > default.
; The flags below are what the test expects; secrets.ini is deliberately NOT used here.
[env:esp32-test-esp]
extends = esp32_common
test_framework = unity
test_build_src = yes
test_filter = test_esp
build_src_filter = -<*> +<esp/> +<protocol/> +<net/> +<manager/ui_data.cpp>
extra_scripts =
build_flags =
  -DESCAPE_AUTH_TOKEN=\"build-flag-token-1234\"
  -DESCAPE_EDIT_TOKEN=\"build-edit-token-1234\"
  -DESCAPE_SETUP_AP_PASSWORD=\"build-ap-pass-123\"
  -DESCAPE_WIFI_SSID=\"BuildNet\"
  -DESCAPE_WIFI_PASSWORD=\"build-wifi-pass\"

; The same on-device tests with Arduino-ESP32 3.x (mbedTLS 3, ESP-IDF 5): run with PlatformIO under Python <= 3.13.
[env:esp32-test-arduino3]
extends = esp32_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
test_framework = unity
test_build_src = yes
test_filter = test_core
build_src_filter = -<*> +<protocol/> +<esp/MbedTlsCryptoBackend.cpp>
extra_scripts =

[env:esp32-test-esp-arduino3]
extends = env:esp32-test-esp
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip

; ---- Maintenance on a running board (no flashing; see scripts/device_storage.py) ----
; PlatformIO refuses to run an environment without any source file, so these list one tiny
; file; the script sets Default(None) and nothing is compiled or flashed.
[maintenance_common]
extends = esp32_common
extra_scripts = post:scripts/device_storage.py
build_src_filter = -<*> +<protocol/Base64Url.cpp>

; Port: custom_device_port below or the ESCAPE_DEVICE_PORT environment variable.
; Values: environment variable, else the custom_* option, else the untracked secrets.ini ([secrets] section).
; Stores an own token in NVS and restarts the board (ESCAPE_AUTH_TOKEN env or custom_auth_token):
;   ESCAPE_AUTH_TOKEN='a-long-random-token-value' pio run -e update-auth-token
[env:update-auth-token]
extends = maintenance_common
custom_device_action = update-auth-token
custom_auth_token =
custom_device_port =

; The plan-edit token (only holders may send plans to devices; PROTOCOL.md 3.1). Stored in NVS, board restarts:
;   ESCAPE_EDIT_TOKEN='another-long-random-token' pio run -e update-edit-token
[env:update-edit-token]
extends = maintenance_common
custom_device_action = update-edit-token
custom_edit_token =
custom_device_port =

; Removes the stored edit token: the normal token may send plans again (a build-time token still applies).
[env:clear-edit-token]
extends = maintenance_common
custom_device_action = clear-edit-token
custom_device_port =

; Stores Wi-Fi credentials in NVS (the library connects with them; without any it opens its setup network):
;   ESCAPE_WIFI_SSID='MyNet' ESCAPE_WIFI_PASSWORD='secret' pio run -e set-wifi
[env:set-wifi]
extends = maintenance_common
custom_device_action = set-wifi
custom_wifi_ssid =
custom_wifi_password =
custom_device_port =

; Prints device id, versions, token state, IP and heap:
;   pio run -e device-info
[env:device-info]
extends = maintenance_common
custom_device_action = device-info
custom_device_port =

; Erases ALL stored settings (token, names, rooms, plans, Wi-Fi), not the program.
; Destructive, so the port must be given explicitly:
;   ESCAPE_DEVICE_PORT=/dev/ttyACM0 pio run -e reset-persistent-storage
[env:reset-persistent-storage]
extends = maintenance_common
custom_device_action = reset-persistent-storage
custom_device_port =

; Memory report (heap, flash, partitions) - a standalone diagnostics program.
[env:diagnostics]
extends = esp32_common
extra_scripts =
build_src_filter = -<*> +<../scripts/pio_shims/Diagnostics.cpp>
; the sketch is included through a wrapper, so PlatformIO's dependency finder does not see its #include <SPIFFS.h>
lib_deps = SPIFFS
